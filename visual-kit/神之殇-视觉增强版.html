<!--

  由 visual-kit/tools/bundle.mjs 生成，共 20 个模块拼成同一作用域。
  双击即可打开，不需要服务器、不需要联网。
  需修改请改 demo.html 与 visual-kit/src/*.js，然后重跑 bundle.mjs。
-->
<script>
// 离线单文件里，最怕的是"白屏且没有任何提示"——双击打开时用户没法看控制台。
// 所以把未捕获错误直接写到页面上。
window.addEventListener('error', function (e) {
  var msg = (e && (e.message || (e.error && e.error.message))) || '未知错误';
  var where = e && e.lineno ? ' @ 第 ' + e.lineno + ' 行' : '';
  document.body.dataset.jsError = msg + where;
  var box = document.getElementById('vk-error');
  if (!box) {
    box = document.createElement('pre');
    box.id = 'vk-error';
    box.style.cssText = 'position:fixed;left:12px;bottom:70px;z-index:99;max-width:70vw;'
      + 'padding:10px 12px;border-radius:8px;background:#2a1417;border:1px solid #6b3038;'
      + 'color:#ffd9d9;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap';
    document.body.appendChild(box);
  }
  box.textContent = '脚本出错：' + msg + where;
});
</script>
<script type="module">

// ────────────────────────────────────────────────────────────────
// src/level.js
// ────────────────────────────────────────────────────────────────
// 所有距离、速度和高度均使用逻辑像素，与设备像素密度无关。
//
// 0.4 起本文件从「单关常量」改为「关卡目录 + schema」。
// 序章仍是默认关卡，数据与 0.3.1 完全一致，保证回归通过。
//
// 关键约束：跳跃射程必须按**该段实际速度**计算。
// 310 速度下单跳水平射程约 229px，375 速度下约 277px；
// 早期外部关卡草案用最高速统一估算，导致低速段断桥实际不可通过。
// validateLevel 会按每段速度重算射程并拒绝不可达的设计。

const WORLD = Object.freeze({
  ground: 606, gravity: 1760, firstJump: -650, airJump: -605,
  runHeight: 70, slideHeight: 29, playerHalfWidth: 13,
  coyoteTime: .11, jumpBuffer: .14, slideDuration: .72, slideCooldown: .16,
  end: 27600,
});

const CHAPTERS = [
  { at: 0, title: '灰烬之城', subtitle: 'I · THE CITY OF ASH', numeral: 'I', speed: 310, line: '北面的街道还在。跟弥娅去无名之门。' },
  { at: 9200, title: '无声圣所', subtitle: 'II · THE SILENT SANCTUARY', numeral: 'II', speed: 345, line: '神死了，连着神殿的回路还在收取记忆。' },
  { at: 18400, title: '神骸之桥', subtitle: 'III · THE BRIDGE OF BONES', numeral: 'III', speed: 375, line: '门就在桥后。里面或许有烬的名字。' },
];

// 连续坡面：视觉和碰撞共用这一条高度曲线，绝不使用"假台阶"。
const TERRAIN = [[0,606],[6000,606],[6270,550],[7000,550],[7290,606],[9450,606],[9740,528],[11200,528],[11480,606],[12300,606],[12600,565],[14300,565],[14600,606],[15700,606],[16000,520],[17700,520],[18000,606],[19800,606],[20100,545],[21850,545],[22150,606],[23300,606],[23600,565],[25200,565],[25500,606],[27600,606]];
function groundAt(x) { return groundHeight(TERRAIN, x, WORLD.ground); }
const SPRINGS=[{id:'wind-0',x:6100,width:100},{id:'wind-1',x:24420,width:100}];
const RINGS=[{id:'ring-0',x:6870,y:350},{id:'ring-1',x:15240,y:390},{id:'ring-2',x:24650,y:380}];

// 手工编排的序章。block=跳跃，beam=滑铲，gap=断桥。
const layout = [
  ['block', 1600, 58, 65], ['beam', 2770, 140], ['gap', 4000, 180],
  ['gap', 5400, 320], ['block', 6760, 68, 80], ['beam', 7750, 155], ['block', 8590, 62, 72],
  ['beam', 9970, 170], ['block', 10860, 70, 85], ['gap', 11800, 280],
  ['beam', 13040, 180], ['block', 14080, 80, 90], ['gap', 15100, 340],
  ['beam', 16380, 180], ['block', 17440, 80, 75],
  ['gap', 19280, 290], ['beam', 20500, 185], ['block', 21540, 90, 92],
  ['gap', 22600, 365], ['beam', 23900, 195], ['block', 24960, 95, 90],
  ['gap', 26050, 345],
];

const OBSTACLES = layout.map(([type,x,width,height], index) => ({ id:`hazard-${index}`, type,x,width, height:height || 0 }));
const SHARDS = [];
function shard(x, y) { SHARDS.push({ id:`memory-${SHARDS.length}`, x, y }); }
for (let x = 780; x < WORLD.end - 700; x += 470) {
  if (!OBSTACLES.some(o => x > o.x - 170 && x < o.x + o.width + 180)) shard(x, WORLD.ground - 45);
}
for (const o of OBSTACLES) {
  if (o.type === 'block') { shard(o.x - 38, WORLD.ground - 125); shard(o.x + o.width + 30, WORLD.ground - 140); }
  if (o.type === 'gap') {
    for (let i = 0; i < 3; i++) shard(o.x + o.width * (i + .5) / 3, WORLD.ground - 115 - Math.sin((i+.5)/3*Math.PI)*48);
  }
  if (o.type === 'beam') shard(o.x + o.width / 2, WORLD.ground - 18);
}
for(const s of SHARDS) s.y+=groundAt(s.x)-WORLD.ground;
for(const spring of SPRINGS) for(let i=0;i<5;i++) shard(spring.x+60+i*60,groundAt(spring.x+60+i*60)-75-Math.sin(i/5*Math.PI)*100);
const TUTORIALS = [
  { from: 0, to: 600, text: '你会自动前行 · 携余火穿过长夜' },
  { from: 950, to: 1740, text: '残碑挡路 · 按 空格 / ↑ 跃过' },
  { from: 2200, to: 2940, text: '神骸低垂 · 按 ↓ / S 滑铲穿过' },
  { from: 3440, to: 4180, text: '前方断桥 · 在边缘起跳' },
  { from: 4730, to: 5790, text: '更宽的深渊 · 跃起后，再按一次跳跃' },
  { from: 5830, to: 6500, text: '踏上青色风印，会被托向高处 · 可在空中再跃' },
  { from: 6500, to: 7100, text: '高处的共鸣环 · 穿环可补充余火，地面路线仍可通过' },
];
function chapterAt(distance) { return chapterIndex(CHAPTERS, distance); }

/**
 * 在指定地形上求地面高度。地形不足两点时回落到该关卡的默认地面。
 * 所有查询都走这个纯函数，level 数据本身不携带方法，便于序列化与校验。
 */
function groundHeight(terrain, x, fallback) {
  for (let i = 1; i < terrain.length; i++) if (x < terrain[i][0]) {
    const [ax, ay] = terrain[i - 1], [bx, by] = terrain[i];
    return ay + (by - ay) * Math.max(0, (x - ax) / (bx - ax));
  }
  return fallback;
}

/** 障碍的碰撞盒。gap 没有实体碰撞盒，返回 null。 */
function hazardBox(o, ground) {
  if (o.type === 'block') return { left: o.x + 5, right: o.x + o.width - 5, top: ground - o.height + 5, bottom: ground };
  if (o.type === 'beam') return { left: o.x + 6, right: o.x + o.width - 6, top: ground - 200, bottom: ground - 43 };
  return null;
}

function hazardBounds(o) { return hazardBox(o, groundAt(o.x)); }

// --------------------------------------------------------------------------- //
// 0.4 · 关卡 schema 与校验
// --------------------------------------------------------------------------- //

/**
 * 单跳水平射程。逐帧复刻物理层的积分顺序（先加重力、再位移），
 * 因此结果就是玩家真能跳出的距离，而不是连续近似的理论值。
 */
function jumpReach(speed) {
  const dt = 1 / 120;
  const { gravity, firstJump } = WORLD;
  let y = 0, vy = firstJump, t = 0;
  while (t < 3) {
    t += dt; vy += gravity * dt; y += vy * dt;
    if (y >= 0 && vy >= 0) break;
  }
  return t * speed;
}

/**
 * 二段跳水平射程：取最优按键时机的结果，是这套物理的射程上限。
 */
function doubleJumpReach(speed) {
  const dt = 1 / 120;
  const { gravity, firstJump, airJump } = WORLD;
  let best = 0;
  for (let trigger = dt; trigger < 0.9; trigger += dt) {
    let y = 0, vy = firstJump, t = 0, fired = false;
    while (t < 3) {
      t += dt; vy += gravity * dt; y += vy * dt;
      if (!fired && t >= trigger) { vy = airJump; fired = true; }
      if (y >= 0 && vy >= 0) break;
    }
    if (t * speed > best) best = t * speed;
  }
  return best;
}

/**
 * 可靠射程：留出 tolerance 秒的时机容差后仍能达到的距离。
 *
 * 二段跳的射程随按键时机单调上升，所以「最晚按」就是极限，
 * 而玩家实际是在空中观察落点后按键。把容差加在极限之前，
 * 得到的就是一个技术合格的玩家稳定能跳出的距离。
 * 极限值本身不可依赖——它要求精确到帧的时机。
 */
function safeDoubleJumpReach(speed, tolerance = 0.12) {
  const dt = 1 / 120;
  const { gravity, firstJump, airJump } = WORLD;
  const reach = (trigger) => {
    let y = 0, vy = firstJump, t = 0, fired = false;
    while (t < 3) {
      t += dt; vy += gravity * dt; y += vy * dt;
      if (!fired && t >= trigger) { vy = airJump; fired = true; }
      if (y >= 0 && vy >= 0) break;
    }
    return t * speed;
  };
  // 先找到最优时机，再往前挪 tolerance 作为可靠时机。
  let bestT = dt, best = 0;
  for (let trigger = dt; trigger < 0.9; trigger += dt) {
    const r = reach(trigger);
    if (r > best) { best = r; bestT = trigger; }
  }
  return reach(Math.max(dt, bestT - tolerance));
}

/** 找出距离 x 最近的段落速度。 */
function speedAt(chapters, x) {
  return chapters[chapterIndex(chapters, x)].speed;
}
/** 找出距离 x 落在哪一段。chapters 需按 at 递增。 */
function chapterIndex(chapters, x) {
  return chapters.reduce((index, chapter, i) => x >= chapter.at ? i : index, 0);
}

/**
 * 校验关卡数据。返回问题数组，空数组表示通过。
 * 目的是让「结构看起来合理但实际不可通关」的草案在合并前就被拦下。
 */
function validateLevel(level) {
  const problems = [];
  const { id, world, chapters, terrain, obstacles, springs = [], rings = [], shards = [], exits = [] } = level;

  if (!id) problems.push('缺少关卡 id');
  if (!Array.isArray(terrain) || terrain.length < 2) problems.push('地形至少需要两个点');
  if (!Array.isArray(chapters) || !chapters.length) problems.push('缺少章节分段');

  // 地形必须严格按 x 递增，否则 groundAt 会静默算错
  for (let i = 1; i < (terrain || []).length; i++) {
    if (terrain[i][0] <= terrain[i - 1][0]) {
      problems.push(`地形 x 未递增：索引 ${i}（${terrain[i - 1][0]} → ${terrain[i][0]}）`);
      break;
    }
  }

  // 障碍 ID 唯一且类型合法
  const seen = new Set();
  const legalTypes = new Set(['block', 'beam', 'gap']);
  for (const o of obstacles || []) {
    if (!o.id) problems.push(`障碍缺少 id（x=${o.x}）`);
    else if (seen.has(o.id)) problems.push(`障碍 id 重复：${o.id}`);
    else seen.add(o.id);
    if (!legalTypes.has(o.type)) problems.push(`障碍类型非法：${o.id} = ${o.type}`);
  }

  // 核心检查：按每段实际速度验证断桥是否真的跳得过去
  for (const o of obstacles || []) {
    if (o.type !== 'gap') continue;
    const speed = speedAt(chapters, o.x);
    const single = jumpReach(speed);
    const safe = safeDoubleJumpReach(speed);
    if(level.echo){
      const stones=(level.echoPlatforms||[]).filter(p=>p.x>o.x&&p.x<o.x+o.width).sort((a,b)=>a.x-b.x);
      if(!stones.length)problems.push(`照忆桥缺少落脚石：${o.id}`);
      let edge=o.x;
      for(const p of stones){if(p.x-edge>safe-70)problems.push(`照忆桥石台不可达：${p.id}`);edge=p.x+p.width;}
      if(o.x+o.width-edge>safe-40)problems.push(`照忆桥出口不可达：${o.id}`);
      continue;
    }
    if(o.steps){
      const platforms=(level.platforms||[]).filter(p=>p.x>o.x&&p.x+p.width<o.x+o.width).sort((a,b)=>a.x-b.x);
      if(!platforms.length)problems.push(`梦桥 ${o.id} 缺少落脚踏板`);
      let edge=o.x;
      for(const p of platforms){if(p.x-edge>safe-40)problems.push(`梦桥踏板不可达：${p.id}`);edge=p.x+p.width;}
      if(o.x+o.width-edge>safe-40)problems.push(`梦桥出口不可达：${o.id}`);
      continue;
    }
    // 起跳需要提前量：从边缘起跳最理想，额外留 12px 容差。
    // 用「可靠射程」而非理论极限——极限值要求逐帧精确按键，实际做不到。
    if (o.width > safe - 12) {
      problems.push(
        `断桥不可通过：${o.id} 宽 ${o.width}px，该段速度 ${speed} 下可靠二段跳射程仅 ${safe.toFixed(0)}px` +
        `（单跳 ${single.toFixed(0)}px，极限二段跳 ${doubleJumpReach(speed).toFixed(0)}px 不可依赖）`
      );
    } else if (o.width > single - 12) {
      // 需要二段跳是允许的设计，但要确认不是宽到必须极限操作
      if (o.width > safe * 0.94) {
        problems.push(`断桥 ${o.id} 宽 ${o.width}px 接近可靠二段跳射程 ${safe.toFixed(0)}px，缺少容错`);
      }
    }
  }

  // 章节分段：at 递增、落在关卡内、速度为正
  const end = world?.end ?? terrain?.at(-1)?.[0];
  for (let i = 0; i < (chapters || []).length; i++) {
    const c = chapters[i];
    if (i > 0 && c.at <= chapters[i - 1].at) problems.push(`章节 at 未递增：${c.title}`);
    if (c.at < 0) problems.push(`章节 at 为负：${c.title}`);
    if (end && c.at >= end) problems.push(`章节起点超出关卡末端：${c.title} @ ${c.at} ≥ ${end}`);
    if (!(c.speed > 0)) problems.push(`章节速度非法：${c.title} = ${c.speed}`);
    if (!c.title) problems.push(`章节缺少标题：@ ${c.at}`);
  }

  // 检查点：必须在关卡内且递增
  for (let i = 1; i < (level.checkpoints || []).length; i++) {
    if (level.checkpoints[i] <= level.checkpoints[i - 1]) {
      problems.push(`检查点未递增：${level.checkpoints[i]} ≤ ${level.checkpoints[i - 1]}`);
    }
  }
  for (const cp of level.checkpoints || []) {
    if (end && (cp < 0 || cp >= end)) problems.push(`检查点越界：${cp}`);
  }

  // 收集物与机制元素必须落在关卡内
  for (const s of springs) if (s.x < 0 || (end && s.x > end)) problems.push(`风印越界：${s.id}`);
  for (const r of rings) if (r.x < 0 || (end && r.x > end)) problems.push(`共鸣环越界：${r.id}`);
  for (const s of shards) if (s.x < 0 || (end && s.x > end)) problems.push(`碎片越界：${s.id}`);

  // 主线物品：既要落在关卡内，也必须不需要极限操作就能拿到。
  // 「写在可完成路径上」是可验证的——高度超过安全跳跃上限就意味着要靠二段跳极限。
  const items = level.items || [];
  const itemIds = new Set();
  for (const it of items) {
    if (!it.id) { problems.push(`物品缺少 id（x=${it.x}）`); continue; }
    if (itemIds.has(it.id)) problems.push(`物品 id 重复：${it.id}`);
    itemIds.add(it.id);
    if (it.x < 0 || (end && it.x > end)) { problems.push(`物品越界：${it.id}`); continue; }
    const ground = groundHeight(terrain || [], it.x, world?.ground);
    const rise = ground - it.y;
    if (rise < 0) {
      problems.push(`物品埋在地面下：${it.id}（y=${it.y} 高于地面 ${ground}）`);
    } else if (!it.required && rise > WORLD.firstJump*WORLD.firstJump/(2*WORLD.gravity)-10) {
      problems.push(
        `主线物品取不到：${it.id} 高出地面 ${rise.toFixed(0)}px，` +
        `该段单跳射程仅 ${jumpReach(speedAt(chapters || [], it.x)).toFixed(0)}px`
      );
    }
    // 主线物品不能压在障碍里，否则玩家必须先受伤
    for (const o of obstacles || []) {
      if (it.x > o.x - 20 && it.x < o.x + o.width + 20) {
        problems.push(`物品 ${it.id} 与障碍 ${o.id} 重叠，可能无法无伤取得`);
      }
    }
  }

  // 出口：必须在关卡末端附近，且声明触发点
  for (const e of exits) {
    if (end && Math.abs(e.x - end) > 400) problems.push(`出口 ${e.id} 距关卡末端过远：${e.x} vs ${end}`);
    if (!e.event) problems.push(`出口 ${e.id} 缺少 event`);
  }

  // 物品本身发出 item 事件；无需再放同名旗标重复解锁剧情。
  const flagIds = new Set();
  const flagEvents = new Set();
  for (const flag of level.flags || []) {
    if (!flag.id) { problems.push(`旗标缺少 id（x=${flag.x}）`); continue; }
    if (flagIds.has(flag.id)) problems.push(`旗标 id 重复：${flag.id}`);
    flagIds.add(flag.id);
    if (!flag.event) problems.push(`旗标 ${flag.id} 缺少 event`);
    if (flag.x < 0 || (end && flag.x > end)) problems.push(`旗标越界：${flag.id}`);
    if (flag.event) flagEvents.add(flag.event);
  }
  for (const it of items) if(!it.event)problems.push(`物品 ${it.id} 缺少 event`);

  const enemyIds=new Set();
  for(const enemy of level.enemies||[]){
    if(!enemy.id||enemyIds.has(enemy.id))problems.push('守灯人 id 缺失或重复');
    enemyIds.add(enemy.id);
    if(!Number.isFinite(enemy.x)||!Number.isFinite(enemy.trigger)||enemy.trigger<0||enemy.x>=end||enemy.trigger>=enemy.x)problems.push(`守灯人位置非法：${enemy.id}`);
    if(!Number.isFinite(enemy.windup)||enemy.windup<.6||!Number.isFinite(enemy.speed)||enemy.speed<=0||!Number.isInteger(enemy.shots)||enemy.shots<1||enemy.shots>2||!Number.isFinite(enemy.interval)||enemy.interval<.5)problems.push(`守灯人预警或弹幕非法：${enemy.id}`);
  }

  // 机制 Boss：与守灯人分开建模，因为规则完全不同——
  // 守灯人是一发就散的街道危险，Boss 有三轮可读阶段、必须给玩家预警窗口，
  // 而且它的成败由 NPC 协同机制（敲钟破盾 / 缆绳送道具 / 护身）决定。
  // 复用 enemies 数组会把这些差异压平成同一条校验线。
  const boss=level.boss;
  if(boss){
    if(!boss.id)problems.push('Boss 缺少 id');
    if(!Number.isFinite(boss.x)||boss.x<=0||(end&&boss.x>end))problems.push(`Boss 位置越界：${boss.id}`);
    if(!Number.isFinite(boss.trigger)||boss.trigger<0)problems.push(`Boss 触发点非法：${boss.id}`);
    // 触发点必须在 Boss 身前，玩家先看见军官再进入战斗；
    if(Number.isFinite(boss.trigger)&&Number.isFinite(boss.x)&&boss.trigger>=boss.x)problems.push(`Boss 触发点应在 Boss 之前：${boss.id}`);
    if(!Number.isInteger(boss.rounds)||boss.rounds<2||boss.rounds>4)problems.push(`Boss 轮数应为 2–4：${boss.id}`);
    if(boss.kind==='chain'&&(!level.brake||boss.rounds!==3||!Number.isFinite(boss.lead)||boss.lead<300||boss.lead>400))problems.push('巨像需要刹步、三条锁链与可见站位');
    if(boss.kind==='chain'){
      if(!Array.isArray(boss.patterns)||boss.patterns.length!==3)problems.push('巨像需要三轮明确的攻击配置');
      else for(const p of boss.patterns){
        if(![p.aim,p.lock,p.tolerance].every(Number.isFinite)||p.aim<1.8||p.lock<.65||p.tolerance<40||!['low','high',null].includes(p.attack)||!Array.isArray(p.waves)||!p.waves.length||p.waves.some((v,i)=>!Number.isFinite(v.at)||!Number.isFinite(v.height)||v.at<.6||v.height<40||v.height>160||(i>0&&v.at-p.waves[i-1].at<.75)))problems.push('巨像招式预警或震波间隔不可读');
      }
    }
    if(boss.kind!=='chain'){
    // 每轮预警必须足够长，玩家能读到预兆再起跳躲开。
    // 0.9 秒是下限：比守灯人的 0.6 秒更宽松，因为 Boss 的法术是本关最重的判定。
    if(!Number.isFinite(boss.windup)||boss.windup<.9)problems.push(`Boss 预警过短：${boss.id}`);
    if(!Number.isFinite(boss.cast)||boss.cast<.6)problems.push(`Boss 法术时长非法：${boss.id}`);
    if(!Number.isFinite(boss.speed)||boss.speed<=0)problems.push(`Boss 弹速非法：${boss.id}`);
    if(!Number.isFinite(boss.shield)||boss.shield<=0)problems.push(`Boss 护盾时长非法：${boss.id}`);
    // 追逐关系：军官会飞、与玩家同速，靠 lead 自然停在玩家前方。
    // lead 太小会退回"贴着 Boss 打"，太大则军官跑出屏幕、玩家看不见预警。
    if(!Number.isFinite(boss.lead)||boss.lead<240||boss.lead>680)problems.push(`Boss 前方距离应在 240–680：${boss.id}`);
    // 齐射：至少 2 发才有"连续躲"的压力；间隔太短会变成无法读招的弹幕。
    if(!Number.isInteger(boss.volley)||boss.volley<2||boss.volley>5)problems.push(`Boss 齐射发数应为 2–5：${boss.id}`);
    if(!Number.isFinite(boss.gap)||boss.gap<.5)problems.push(`Boss 齐射间隔过短：${boss.id}`);
    // 反击器物必须落在玩家前方够远、但仍能在跑到之前看清的位置。
    if(!Number.isFinite(boss.relicLead)||boss.relicLead<120||boss.relicLead>boss.lead)problems.push(`Boss 器物投放距离非法：${boss.id}`);
    // 反击器物：每轮一件，且必须能被拾取再补发。
    // 位置在运行时由 relicLead 决定，所以这里不再要求静态 x/y。
    if(!Array.isArray(boss.patterns)||boss.patterns.length!==boss.rounds||boss.patterns.some(p=>!Array.isArray(p)||p.length<2||p.length>5||p.some(k=>!['low','high','fall','wave'].includes(k))))problems.push('Boss 攻击组合非法');
    const relics=boss.relics||[];
    if(relics.length!==boss.rounds)problems.push(`Boss 反击器物数量应与轮数一致：${boss.id}`);
    const relicIds=new Set();
    for(const relic of relics){
      if(!relic.id||relicIds.has(relic.id))problems.push(`Boss 反击器物 id 缺失或重复：${boss.id}`);
      relicIds.add(relic.id);
      if(!Number.isFinite(relic.life)||relic.life<3)problems.push(`Boss 反击器物存在时间过短：${relic.id}`);
    }
    // NPC 协同点：敲钟、缆绳、护身都必须在玩家与 Boss 之间，且互相错开，
    // 否则玩家会在同一屏里同时处理两件协同，失去"依次轮到谁"的节奏。
    const stations=boss.stations||[];
    const kinds=new Set();
    const xs=[];
    for(const station of stations){
      if(!['bell','rope','ward'].includes(station.kind))problems.push(`Boss 协同点类型非法：${boss.id}/${station.kind}`);
      if(kinds.has(station.kind))problems.push(`Boss 协同点重复：${station.kind}`);
      kinds.add(station.kind);
      if(!Number.isFinite(station.x)||station.x<0||(end&&station.x>end))problems.push(`Boss 协同点越界：${station.kind}`);
      xs.push(station.x);
    }
    for(const kind of ['bell','rope','ward'])if(!kinds.has(kind))problems.push(`Boss 缺少协同点：${kind}`);
    xs.sort((a,b)=>a-b);
    for(let i=1;i<xs.length;i++)if(Math.abs(xs[i]-xs[i-1])<80)problems.push(`Boss 协同点过近，无法依次处理：${boss.id}`);
  }
  }
  const mechanisms=[...(level.tides||[]),...(level.platforms||[])],mechanismIds=new Set();
  for(const m of mechanisms){
    if(!m.id||mechanismIds.has(m.id))problems.push('路线机关 id 缺失或重复');mechanismIds.add(m.id);
    if(![m.x,m.trigger,m.warning,m.life].every(Number.isFinite)||!(m.x>m.trigger&&m.trigger>=0&&m.x<end&&m.warning>=.5&&m.life>=.3))problems.push(`路线机关预警或位置非法：${m.id}`);
  }
  for(const p of level.platforms||[])if(!(p.width>=100&&Number.isFinite(p.y)&&p.y<world.ground&&p.life>=3))problems.push(`梦桥踏板非法：${p.id}`);
  for(const w of level.windZones||[])if(!(w.from>=0&&w.to>w.from&&w.to<=end&&w.lift>=.5&&w.lift<=1&&w.push>=0&&w.push<=120))problems.push(`风域参数非法：${w.id}`);
  for(const z of level.tidalChannels||[]){
    if(!z.id||mechanismIds.has(z.id))problems.push('水道 id 缺失或重复');mechanismIds.add(z.id);
    const speed=(level.chapters.filter(c=>c.at<=z.x).at(-1)||level.chapters[0]).speed;
    if(!level.brake||![z.x,z.width,z.period,z.open,z.offset||0].every(Number.isFinite)||z.x<100||z.width<200||z.x+z.width>end||z.period<=z.open+1||z.open<(z.width+150)/speed)problems.push(`水道位置或退潮窗口不可通行：${z.id}`);
  }
  for(const p of level.platforms||[])if(p.collapse!=null&&(!Number.isFinite(p.collapse)||p.collapse<.45))problems.push(`木桥断裂预警过短：${p.id}`);
  if(level.echo){
    const echoIds=new Set();
    for(const p of level.echoPlatforms||[]){
      if(!p.id||echoIds.has(p.id)||![p.x,p.y,p.width].every(Number.isFinite)||p.x<0||p.x+p.width>end||p.width<120||p.y<world.ground-100||p.y>=world.ground)problems.push('照忆石台位置非法');echoIds.add(p.id);
    }
    for(const wall of level.echoWalls||[]){
      if(!wall.id||echoIds.has(wall.id)||![wall.x,wall.width,wall.top,wall.bottom].every(Number.isFinite)||wall.x<0||wall.x+wall.width>end||wall.width<20||wall.top>=world.ground-200||wall.bottom<world.ground)problems.push('照忆封墙位置非法');echoIds.add(wall.id);
      if((level.echoPlatforms||[]).some(p=>wall.x<p.x+p.width+35&&wall.x+wall.width>p.x-35))problems.push('照忆封墙必须留出空中收光与再照亮的距离');
    }
    for(const r of level.rescues||[])if(!r.id||!level.flags?.some(f=>f.id===r.id&&f.manual)||!Number.isFinite(r.x)||r.x<0||r.x>end||r.seconds<.8||r.seconds>2)problems.push('救援点与手动旗标不匹配');
    const z=level.greyChase;if(!z||!level.brake||!Number.isFinite(z.speed)||z.speed<=0||z.speed>=speedAt(chapters,z.trigger)||z.lead<500)problems.push('灰潮追逐必须留出救援和移动余量');
  }
  return problems;
}

/**
 * 关卡目录。序章保持 0.3.1 原样，作为回归基准。
 * 后续关卡由各自模块导出后注册。
 */
const LEVELS = {
  prologue: {
    id: 'prologue',
    title: '序章 · 灰烬之城',
    world: WORLD,
    chapters: CHAPTERS,
    terrain: TERRAIN,
    obstacles: OBSTACLES,
    springs: SPRINGS,
    rings: RINGS,
    shards: SHARDS,
    tutorials: TUTORIALS,
    checkpoints: [9200, 18400],
    exits: [{ id: 'threshold-1', x: WORLD.end, event: 'departure' }],
  },
};

function registerLevel(level) {
  const problems = validateLevel(level);
  if (problems.length) {
    throw new Error(`关卡 ${level.id} 校验未通过:\n  - ${problems.join('\n  - ')}`);
  }
  LEVELS[level.id] = level;
  return level;
}

// 两节腿的圆交点。只取朝行进方向凸出的膝盖，避免摆腿时反关节。
function legJoints(hip,foot,upper=22,lower=23) {
  const dx=foot[0]-hip[0],dy=foot[1]-hip[1],raw=Math.hypot(dx,dy);
  const d=Math.max(.01,Math.min(upper+lower-.01,raw));
  const along=(upper*upper-lower*lower+d*d)/(2*d);
  const bend=Math.sqrt(Math.max(0,upper*upper-along*along));
  const ux=dx/Math.max(raw,.01),uy=dy/Math.max(raw,.01);
  return {knee:[hip[0]+ux*along+uy*bend,hip[1]+uy*along-ux*bend],foot:[hip[0]+ux*d,hip[1]+uy*d]};
}
// 着地脚由前向后推地；后脚抬跟、收腿，再向前摆。左右腿错开半周期。
function strideFoot(t,offset=0) {
  const phase=((t*2.6+offset)%1+1)%1;
  if(phase<.6)return [15-32*phase/.6,-2];
  const q=(phase-.6)/.4,e=q*q*(3-2*q);
  return [-17+32*e,-2-22*Math.sin(Math.PI*q)];
}
// 时间连续的关节姿态，独立于显示器刷新率；物理脚点始终是局部原点。
function runnerPose(p,t,running=true) {
  if(p.collapse>0){
    const base=runnerPose({...p,collapse:0,slideTime:0,grounded:true},t,false),q=Math.min(1,p.collapse);
    const kneel={hips:[-7,-16],chest:[9,-33],head:[18,-42],hand:[29,-13],elbow:[24,-25],backElbow:[-8,-20],backHand:[-19,-3],kneeA:[13,-3],footA:[-4,-3],kneeB:[-20,-4],footB:[-34,-3],cape:[[-2,-37],[-30,-33],[-53,-18],[-68,-6],[-43,-3],[-15,-14]]};
    for(const key of Object.keys(kneel)){if(key==='cape')base.cape=base.cape.map((pt,i)=>pt.map((v,k)=>v+(kneel.cape[i][k]-v)*q));else base[key]=base[key].map((v,k)=>v+(kneel[key][k]-v)*q);}
    return base;
  }
  const phase=t*2.6*Math.PI*2,cycle=Math.sin(phase),air=!p.grounded,slide=p.slideTime>0;
  if(slide) return {hips:[-15,-12],chest:[4,-17],head:[16,-19],hand:[37,-14],elbow:[22,-12],backElbow:[-22,-17],backHand:[-35,-6],kneeA:[6,-7],footA:[30,-3],kneeB:[-27,-5],footB:[-44,-3],cape:[[-4,-22],[-32,-24],[-58,-12],[-80,-14],[-64,-4],[-24,-10]],squash:1};
  const compression=(p.landPose||0)*14,bob=air?0:running?Math.abs(cycle)*1.2:Math.sin(t*1.7)*.4;
  const chest=[air?-2:4,-58+compression-bob],head=[air?2:8,-73+compression-bob];
  const hand=[27+Math.sin(t*5)*1.4,air?-50:-43+compression-bob];
  const tuck=(p.airSpin||0)>0?1:air&&p.vy<0?.6:0;
  const hips=[0,-41+compression-bob];
  const legA=legJoints(hips,air?[8,-2-tuck*18]:running?strideFoot(t):[9,-2]);
  const legB=legJoints(hips,air?[-22,-4-tuck*12]:running?strideFoot(t,.5):[-11,-2]);
  return {hips,chest,head,hand,elbow:[13,-39+compression-bob],backElbow:[-17,-41+compression+cycle*4],backHand:[-20-cycle*8,-30+compression],
    kneeA:legA.knee,footA:legA.foot,kneeB:legB.knee,footB:legB.foot,
    cape:[[chest[0]-7,chest[1]-4],[-30,-53+Math.sin(t*11)*4],[-55,-45+Math.sin(t*13)*6],[-77,-34+Math.sin(t*10)*8],[-56,-32+Math.sin(t*12)*6],[-21,-32]],squash:1};
}

const clampScene=value=>Math.max(0,Math.min(1,value));
const easeScene=value=>{const q=clampScene(value);return q*q*(3-2*q);};
const SCENE_DURATIONS={arrival:2.8,defeat:2.1,departure:4.2};
function flameStrength(health) {return [0,.36,.68,1][Math.max(0,Math.min(3,Math.round(health)))];}

// 演出时不推进 Runner；暂停、跳过只改变演出时间，不改变物理和结算数据。
class Cinematic {
  constructor(){this.active=false;this.type=null;this.time=0;this.cues=new Set();}
  begin(type,{falling=false,reducedMotion=false}={}) {
    if(!(type in SCENE_DURATIONS))throw new Error('Unknown cinematic');
    this.type=type;this.time=0;this.active=true;this.falling=falling;this.reducedMotion=reducedMotion;this.cues.clear();
  }
  cancel(){this.active=false;this.type=null;}
  skip(){if(this.active)this.time=SCENE_DURATIONS[this.type];}
  update(dt){if(this.active)this.time=Math.min(SCENE_DURATIONS[this.type],this.time+Math.max(0,dt));return this.active&&this.time>=SCENE_DURATIONS[this.type];}
  takeCue(name,progress){if(this.active&&!this.cues.has(name)&&this.time/SCENE_DURATIONS[this.type]>=progress){this.cues.add(name);return true;}return false;}
  sample() {
    if(!this.active)return null;
    const q=clampScene(this.time/SCENE_DURATIONS[this.type]);
    const base={type:this.type,q,time:this.time,offsetX:0,offsetY:0,alpha:1,collapse:0,flame:1,gate:0,running:false,scale:1,falling:this.falling};
    if(this.type==='arrival') {
      const landing=easeScene(q/.42),rise=easeScene((q-.48)/.38);
      return {...base,offsetX:this.reducedMotion?0:-110*(1-landing),offsetY:this.reducedMotion?0:-160*(1-landing),alpha:Math.min(1,q*7),collapse:q<.42?0:(1-rise)*.8,flame:.06+.94*easeScene((q-.43)/.42)};
    }
    if(this.type==='defeat')return {...base,collapse:easeScene(q/.53),offsetY:this.falling?60+q*110:0,alpha:1-easeScene((q-.55)/.4),flame:.35*(1-easeScene(q/.66))};
    return {...base,offsetX:170*easeScene((q-.17)/.58),alpha:1-easeScene((q-.68)/.18),flame:1-easeScene((q-.64)/.2),gate:easeScene(q/.27)*(1-easeScene((q-.85)/.15)),running:q>.17&&q<.76,scale:1-.25*easeScene((q-.4)/.4)};
  }
}

// Catmull–Rom 中心线 → 有厚度的连续丝带；数值和采样数均有上限。
function ribbonMesh(points,time,strength=1,reducedMotion=false) {
  if(points.length<2)return {center:[],left:[],right:[]};
  const center=[];
  for(let i=0;i<points.length-1;i++) {
    const p0=points[Math.max(0,i-1)],p1=points[i],p2=points[i+1],p3=points[Math.min(points.length-1,i+2)];
    for(let j=0;j<3;j++){const t=j/3,t2=t*t,t3=t2*t;center.push([0,1].map(k=>.5*((2*p1[k])+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3)));}
  }
  center.push([...points.at(-1)]);
  const left=[],right=[],curve=center.map(p=>[...p]);
  for(let i=0;i<center.length;i++) {
    const q=i/(center.length-1),a=curve[Math.max(0,i-1)],b=curve[Math.min(center.length-1,i+1)],dx=b[0]-a[0],dy=b[1]-a[1],length=Math.hypot(dx,dy)||1,nx=-dy/length,ny=dx/length;
    const flutter=reducedMotion?0:Math.sin(time*8-q*11)*(1-q)*8*Math.sin(Math.PI*q);
    const width=Math.sin(Math.PI*q*.94)*(.6+4.8*strength)*(1+.2*Math.sin(time*5-q*12));
    center[i]=[center[i][0]+nx*flutter,center[i][1]+ny*flutter];
    left.push([center[i][0]+nx*width,center[i][1]+ny*width]);right.push([center[i][0]-nx*width,center[i][1]-ny*width]);
  }
  return {center,left,right};
}

// 攻击参数由模拟和画面共同读取，避免预警、判定和当前锁孔错位。
const CHAIN_PATTERNS=[

        c.quadraticCurveTo(sx-21,floor-114,sx-14,floor-90);
        c.quadraticCurveTo(sx-11,floor-131,sx,floor-160);
        c.quadraticCurveTo(sx+15,floor-131,sx+14,floor-91);

  wardenBoss(c,camera,w,t,player){

    c.restore();
    c.save();c.translate(x,y);

    if(boss.kind==='seal'){

function intersects(a,b) { return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top; }
function playerBounds(p) { return { left:p.x-WORLD.playerHalfWidth, right:p.x+WORLD.playerHalfWidth, top:p.y-(p.slideTime>0?WORLD.slideHeight:WORLD.runHeight)+5, bottom:p.y-3 }; }

/**
 * 军官的悬浮高度（相对桥面的像素）。他会飞、无视地形，所以这个值不随地面起伏变化。
 * 取 92 是为了让他在画面上明确"悬空"，同时仍与玩家的跳跃弧线处在同一视野带里。
 */
const BOSS_HOVER=92;

/** 无 DOM 的确定性模拟层。渲染、输入和音效通过事件解耦。 */
class Runner {
  /**
   * @param {object} [level] 关卡数据；缺省为序章。传入后所有世界查询走该关卡。
   * 关卡切换用 loadLevel，不在运行中替换引用。
   */
  constructor(level = LEVELS.prologue) { this.level = level; this.reset(); }

  /** 载入关卡。校验由 level.registerLevel 在注册时完成，此处只做防御性检查。 */
  loadLevel(level) {
    if (!level || !level.terrain || !level.obstacles || !level.chapters) {
      throw new Error('关卡数据不完整：需要 terrain / obstacles / chapters');
    }
    this.level = level;
    this.reset();
    return this;
  }

  reset() {
    const L = this.level;
    this.x=0; this.y=L.world.ground; this.vy=0; this.grounded=true;
    this.jumpsLeft=2; this.coyote=L.world.coyoteTime; this.jumpBuffer=0;
    this.slideTime=0; this.slideCooldown=0; this.slideQueued=0;
    this.health=3; this.invulnerable=0; this.collected=new Set();
    this.braking=false;this.echoLight=false;this.rescueProgress=0;this.rescueId=null;this.rescueTimes=new Map();this.chaseAge=0;this.elapsed=0; this.respawns=0; this.chapter=0; this.checkpoint=0;
    this.checkpointShards=new Set(); this.state='running'; this.events=[];
    this.prevX=this.x;this.prevY=this.y;this.jumpPose=0;this.landPose=0;this.airSpin=0;
    this.rings=new Set();this.checkpointRings=new Set();this.usedSprings=new Set();this.combo=0;this.bestCombo=0;this.comboTime=0;
    this.flag=new Set();this.items=new Set();this.checkpointItems=new Set();this.checkpointFlags=new Set();
    this.bridgeMemory=0;
    this.warmth=0;this.litLamps=new Set();
    this.resetEnemies();
    this.resetMechanisms();
    this.resetBoss();
  }
  // 三轮逐步引入低刃、高刃、落印；反击飞行结束才计伤害。
  resetBoss() {
    const boss=this.level.boss;
    if(!boss){this.boss=null;this.bossShots=[];this.bossRelic=null;return;}
    // 检查点已经在 Boss 之后时，这场战斗视为已完成，不再重复打。
    const done=this.checkpoint>=boss.x;
    this.boss={
      phase:done?'defeated':'idle',
      x:boss.x,          // 军官当前世界坐标：每个物理帧跟着玩家一起前进
      y:this.groundAt(boss.x)-BOSS_HOVER, // 悬浮高度，无视地形起伏
      round:0,           // 已打完的轮数
      age:0,             // 当前阶段已进行的秒数
      shotsFired:0,      // 本轮已放出的法术数（齐射计数，取代原来的 charged 布尔）
      charged:false,     // 本轮是否已发过预警（保留：入场首帧与渲染会读）
      stunned:false,shieldAge:0, // 下一轮的盾从反击命中后开始生长
      relicTimer:0,      // 反击器物剩余存在时间（漏捡后会在下一轮重新出现）
      relicMissed:false, // 本轮器物是否已错过一次——用于"再出现"提示
      hits:0,            // 已经反击成功的次数
      ward:boss.ward!==false, counter:null,
      flight:0,          // 飞行起伏的相位，纯视觉

  }
  /** 玩家当前是否处于 Boss 战范围（预警到击败之间都算，用于 HUD 与渲染）。 */
  get inBossFight(){return !!this.boss&&this.boss.phase!=='idle'&&this.boss.phase!=='defeated';}
  setBrake(held){this.braking=!!held&&!!this.level.brake;}
  setEcho(held){this.echoLight=!!held&&!!this.level.echo&&this.state==='running';}
  get savedPeople(){return (this.level.rescues||[]).filter(r=>this.flag.has(r.id)).length;}
  get greyFront(){const z=this.level.greyChase;return z&&this.flag.has('ember-spent')?z.trigger-z.lead+this.chaseAge*z.speed:null;}
  updateRescue(dt){
    if(!this.level.echo||!this.items.has('memory-ember'))return;
    const r=(this.level.rescues||[]).find(r=>!this.flag.has(r.id)&&this.x>=r.x-65&&this.x<=r.x+65);
    this.rescueId=r?.id||null;
    if(!r){this.rescueProgress=0;return;}
    if(this.echoLight&&this.grounded)this.rescueProgress+=dt;

      if(o.type==='gap' || o.x>this.x+100 || o.x+o.width<this.x-50) continue;
      if(intersects(box,this.boxOf(o))) this.hurt();
      if(this.state==='dead') return;
    }
    for(const s of L.shards) {
      if(this.collected.has(s.id)) continue;
      if(intersects(box,{left:s.x-16,right:s.x+16,top:s.y-17,bottom:s.y+17})) {
        this.collected.add(s.id); this.emit('collect',{x:s.x,y:s.y});
        this.combo++;this.comboTime=2.4;this.bestCombo=Math.max(this.bestCombo,this.combo);
      }
    }
    for(const ring of L.rings) if(!this.rings.has(ring.id) && Math.hypot(this.x-ring.x,this.y-36-ring.y)<49) {
      this.rings.add(ring.id);this.health=Math.min(3,this.health+1);this.emit('resonance',{x:ring.x,y:ring.y,id:ring.id});
    }
    // 主线物品：铜片一类的东西。与碎片不同，它不参与连忆，且在检查点回滚，
    // 所以读档不能重刷主线收集物。
    for(const item of L.items||[]) {
      if(this.items.has(item.id)) continue;
      if((item.required&&this.prevX<item.x&&this.x>=item.x)||intersects(box,{left:item.x-22,right:item.x+22,top:item.y-24,bottom:item.y+24})) {
        this.items.add(item.id);
        if(item.kind==='coal'){this.warmth=L.warmthDuration;this.emit('warmth',{x:item.x,y:item.y});}
        this.emit('item',{id:item.id,event:item.event,x:item.x,y:item.y,place:item.place});
      }
    }
    for(const lamp of L.lamps||[])if(!this.litLamps.has(lamp.id)&&this.prevX<lamp.x&&this.x>=lamp.x){
      this.litLamps.add(lamp.id);this.emit('lamp-lit',{id:lamp.id,x:lamp.x,y:this.groundAt(lamp.x)-80});
    }
    if(this.warmth===0&&(L.coldZones||[]).some(zone=>this.x>=zone.from&&this.x<=zone.to))this.hurt();
    if(this.state==='dead')return;
    // 通用旗标：章节任务用它记录一次性触发（进入新地点、桥稳定等）
    for(const flag of L.flags||[]) {
      if(flag.manual)continue;
      if(this.flag.has(flag.id)) continue;
      if(this.prevX<flag.x&&this.x>=flag.x) {
        this.flag.add(flag.id); this.emit('flag',{id:flag.id,event:flag.event,x:flag.x});
      }
    }
    // Boss 入场：越过触发点就开打。军官从这一刻起飞在玩家前方，
    // charge 阶段从此刻起算，所以玩家读到的第一段预警时长是完整的 windup。
    if(L.boss&&this.boss&&this.boss.phase==='idle'&&this.prevX<L.boss.trigger&&this.x>=L.boss.trigger){
      this.boss.phase='charge';this.boss.age=0;this.boss.charged=true;
      // 军官立刻落到玩家前方，避免入场瞬间从关卡数据里的原始坐标"弹"过来。
      this.boss.x=this.x+L.boss.lead;
      this.boss.y=this.groundAt(this.boss.x)-BOSS_HOVER;
      this.emit('boss-enter',{x:this.boss.x,y:this.boss.y});
    }
    if(this.x>=W.end&&(!this.boss||this.boss.phase==='defeated')) { this.x=L.boss?this.x:W.end; this.state='won'; this.emit('won'); }
  }
}

/**
 * 基础数学与工具。全部无副作用、可树摇。
 * 这一层刻意不依赖任何游戏模块——visual-kit 可以脱离《神之殇》单独使用。
 */

/**
 * 圆周率 ×2。
 *
 * 为什么叫 `VK_TAU` 而不叫 `TAU`：打包成单文件时（tools/bundle.mjs），
 * 所有模块会被拼进同一个作用域，顶层重名会直接让整份脚本语法报错。
 * 而 `src/renderer.js` 里已经有一个顶层的 `TAU`——那是原项目的文件，
 * 我们不改它，所以 kit 这边统一加 `VK_` 前缀让路。
 * 项目的 AGENTS.md 里"顶层变量必须全局唯一"这条约定，说的就是这件事。
 */
const VK_TAU = Math.PI * 2;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => (b === a ? 0 : (v - a) / (b - a));

/** 平滑阶跃（Hermite）。比线性更有"重量"，且首尾导数为零，不会顿挫。 */
const smooth = (t) => {
  t = clamp(t, 0, 1);
  return t * t * (3 - 2 * t);
};

/** 更陡的平滑阶跃，用于希望"起步快、收尾慢"的插值。 */
const smoother = (t) => {
  t = clamp(t, 0, 1);
  return t * t * t * (t * (t * 6 - 15) + 10);
};

/** 指数趋近，帧率无关。tau 越大越"黏"。 */
const damp = (a, b, tau, dt) => lerp(a, b, 1 - Math.exp(-dt / Math.max(1e-6, tau)));

/** 确定性伪随机：同一 seed 永远给同一个值，便于回放与截图复现。 */
function rand(seed) {
  const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

/**
 * 整数哈希伪随机，值域 [0,1)。
 *
 * 比 `rand()` 快约 5 倍——`rand()` 每次都调 `Math.sin`，
 * 而粒子系统每帧要抽成百上千个随机数，那是热路径上的实打实开销。
 * 用 `Math.imul` 的整数雪崩混合，无浮点三角函数，且同样是确定性的：
 * 同一 seed 序列完全可复现，回放与截图验证不受影响。
 */
function hash32(n) {
  n = (n ^ 61) ^ (n >>> 16);
  n = n + (n << 3);
  n = n ^ (n >>> 4);
  n = Math.imul(n, 0x27d4eb2d);
  n = n ^ (n >>> 15);
  return (n >>> 0) / 4294967296;
}

/** 一维值噪声，用于风、抖动、grain。 */
function noise1(x) {
  const i = Math.floor(x), f = x - i;
  return lerp(rand(i), rand(i + 1), smooth(f));
}

/** 二维值噪声（双线性），用于火焰、雾气、藤蔓。 */
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = smooth(x - ix), fy = smooth(y - iy);
  const a = rand(ix * 57.1 + iy * 131.7);
  const b = rand((ix + 1) * 57.1 + iy * 131.7);
  const c = rand(ix * 57.1 + (iy + 1) * 131.7);
  const d = rand((ix + 1) * 57.1 + (iy + 1) * 131.7);
  return lerp(lerp(a, b, fx), lerp(c, d, fx), fy);
}

const vec = (ang, len = 1) => [Math.cos(ang) * len, Math.sin(ang) * len];

/**
 * 性能层。
 *
 * 现代 Canvas 2D 的瓶颈不在"画了多少像素"，而在**路径构建与状态切换的次数**。
 * 这个渲染器每帧要重建几十条地形/远景/草丛路径，即使它们的内容几乎没变。
 * 所以这里的三个缓存各自针对一类重复劳动：
 *
 *   TileCache    远景视差——一条循环贴图，滚动只在边界重画
 *   StripCache   世界空间静态几何（地面、桥墩）——只在离开缓存窗口时重画
 *   QualityGovernor 帧时间超预算时逐级降档；特效变少，但操作不变卡
 *
 * 外加 DynamicResolution：真正撑不住时降内部分辨率——这是最有效的一档。
 */



/** 帧时间统计（EMA + 分位近似），输出给 HUD 与基准测试。 */
class FrameStats {
  constructor(window = 120) {
    this.buf = new Float32Array(window);
    this.i = 0;
    this.n = 0;
    this.ema = 16.7;
    this.max = 16.7;
    this._sorted = null;
  }
  push(ms) {
    this.buf[this.i] = ms;
    this.i = (this.i + 1) % this.buf.length;
    if (this.n < this.buf.length) this.n++;
    this.ema = this.ema * 0.9 + ms * 0.1;
    this._sorted = null;
    return this;
  }
  get fps() { return this.ema > 0 ? 1000 / this.ema : 0; }
  get avg() {
    if (!this.n) return 0;
    let s = 0;
    for (let i = 0; i < this.n; i++) s += this.buf[i];
    return s / this.n;
  }
  /** 近似 p95：把样本排序取 95 分位。仅在显式调用时排序。 */
  percentile(p) {
    if (!this._sorted) {
      this._sorted = Array.from(this.buf.slice(0, this.n)).sort((a, b) => a - b);
    }
    const s = this._sorted;
    if (!s.length) return 0;
    return s[clamp(Math.floor(s.length * p), 0, s.length - 1)];
  }
  reset() { this.i = 0; this.n = 0; this.ema = 16.7; this._sorted = null; }
}

/**
 * 循环贴图缓存。用于视差远景：内容在贴图内是周期性的，
 * 只有滚动到边界时才把贴图整体平移重画一次。
 */
class TileCache {
  constructor(tileW, h) {
    this.canvas = typeof OffscreenCanvas !== 'undefined'
      ? new OffscreenCanvas(Math.max(2, Math.ceil(tileW)), Math.max(2, Math.ceil(h)))
      : Object.assign(document.createElement('canvas'), { width: Math.max(2, Math.ceil(tileW)), height: Math.max(2, Math.ceil(h)) });
    this.ctx = this.canvas.getContext('2d');
    this.tileW = tileW;
    this.tileH = h;
    this.h = h;
    // 计数器：用来验证"贴图只烘一次、之后全是 blit"。
    // 没有这两个数字就只能靠"看起来没卡"来判断，那不算证据。
    this.repaints = 0;
    this.blits = 0;
  }
  /** 用 painter 重画整张贴图。painter(ctx, tileW, h)。 */
  repaint(painter) {
    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
    this.ctx.clearRect(0, 0, this.tileW, this.h);
    painter(this.ctx, this.tileW, this.h);
    this.repaints++;
  }
  /** 把贴图铺满 [0,w]，按 offset 平移。offset 任意大小都可以，内部会取模。 */
  blit(ctx, offset, w, y = 0) {
    const o = ((offset % this.tileW) + this.tileW) % this.tileW;
    let x = -o;
    while (x < w) {
      ctx.drawImage(this.canvas, x, y);
      x += this.tileW;
      this.blits++;
    }
  }
}

/**
 * 世界空间长条缓存。用于"位置固定、只随相机平移"的静态几何。
 *
 * 用法：
 *   const strip = new StripCache(startX, width, height);
 *   strip.ensure(ctx, camera - 200, camera + w + 200, (g, x0, x1) => { ...画地面... });
 *   strip.draw(ctx, camera);
 *
 * 只要相机还在缓存窗口内就直接 blit；出去才重画一次。
 * `ensure` 的重画成本是摊还的，帧率因此平稳。
 */
class StripCache {
  constructor(width, height, pad = 400) {
    this.pad = pad;
    const w = Math.max(2, Math.ceil(width));
    const h = Math.max(2, Math.ceil(height));
    this.canvas = typeof OffscreenCanvas !== 'undefined'
      ? new OffscreenCanvas(w, h)
      : Object.assign(document.createElement('canvas'), { width: w, height: h });
    this.ctx = this.canvas.getContext('2d');
    this.width = w;
    this.height = h;
    this.originX = 0;      // 缓存左端对应的世界 x
    this.valid = false;
    this.repaints = 0;
    this.blits = 0;
  }
  /** 保证 [from,to] 落在缓存窗口内；不在就重画。 */
  ensure(from, to, painter) {
    if (this.valid && from >= this.originX && to <= this.originX + this.width) return false;
    // 以请求区间为中心对齐重画，避免每帧都刚好越界一点点
    const span = to - from;
    const half = Math.floor((this.width - span) / 2);
    this.originX = Math.floor(from - Math.max(0, half));
    this.ctx.setTransform(1, 0, 0, 1, -this.originX, 0);
    this.ctx.clearRect(0, 0, this.width, this.height);
    painter(this.ctx, this.originX, this.originX + this.width);
    this.valid = true;
    this.repaints++;
    return true;
  }
  /** 把可见窗口贴到主画布。 */
  draw(ctx, camera) {
    if (!this.valid) return;
    this.blits++;
    ctx.drawImage(this.canvas, 0, 0, this.width, this.height,
      this.originX - camera, 0, this.width, this.height);
  }
  invalidate() { this.valid = false; }
}

/**
 * 画质调度。根据帧时间在 0–3 档之间移动，并带滞回，避免在两档之间抖。
 *
 * 档位含义（可在 opts 里覆盖）：
 *   3 满配：全部后处理 + 全部粒子
 *   2 标准：跳过最贵的后处理
 *   1 精简：粒子减半、跳过后处理
 *   0 保底：粒子 1/4、关闭后处理与速度线
 */
class QualityGovernor {
  constructor({ targetMs = 13.5, minLevel = 0, maxLevel = 3 } = {}) {
    this.target = targetMs;
    this.min = minLevel;
    this.max = maxLevel;
    this.level = maxLevel;
    this._bad = 0;
    this._good = 0;
    this.locked = false;    // 锁定后不再自动调整（基准测试用）
  }
  /**
   * @param frameMs 上一帧实际耗时
   * @returns 是否发生了档位变化
   */
  step(frameMs) {
    if (this.locked) return false;
    const before = this.level;
    if (frameMs > this.target * 1.25) {
      this._bad++; this._good = 0;
      // 连续 3 帧超支才降档：单帧毛刺（比如切场景）不该触发
      if (this._bad >= 3 && this.level > this.min) { this.level--; this._bad = 0; }
    } else if (frameMs < this.target * 0.72) {
      this._good++; this._bad = 0;
      // 连续 30 帧富余才升档：升得慢，避免来回抖
      if (this._good >= 30 && this.level < this.max) { this.level++; this._good = 0; }
    } else {
      this._bad = 0; this._good = 0;
    }
    return this.level !== before;
  }
  /** 各系统的预算，由 level 派生。 */
  get budgets() {
    const l = this.level;
    return {
      level: l,
      particles: [120, 300, 650, 900][l],
      speedLines: l >= 3,
      bloom: l >= 3,
      aberration: l >= 3,
      grain: l >= 1,
      smearCount: [0, 1, 3, 4][l],
      grassStep: [3, 2, 1, 1][l],   // 草丛抽稀步长
      shadowBlur: l >= 2,
    };
  }
}

/**
 * 动态分辨率。真正的保命档：帧时间持续超预算时降低内部渲染分辨率，
 * 之后帧率恢复再升回。视觉上先是略微变软，接着才是掉帧——
 * 对跑酷游戏，前者远比后者可接受。
 */
class DynamicResolution {
  constructor({ min = 0.6, max = 1, settleMs = 900 } = {}) {
    this.min = min;
    this.max = max;
    this.scale = max;
    this.settleMs = settleMs;
    this._hold = 0;
    this.enabled = true;
  }
  step(frameMs, targetMs = 13.5, dtMs = 16.7) {
    if (!this.enabled) return this.scale;
    this._hold = Math.max(0, this._hold - dtMs);
    if (this._hold > 0) return this.scale;
    const before = this.scale;
    if (frameMs > targetMs * 1.2) {
      this.scale = clamp(this.scale - 0.05, this.min, this.max);
    } else if (frameMs < targetMs * 0.6) {
      this.scale = clamp(this.scale + 0.03, this.min, this.max);
    }
    if (this.scale !== before) this._hold = this.settleMs;
    return this.scale;
  }
}

/**
 * 一个把上面全部串起来的门面。挂到任意 renderer 上即可。
 */
class PerfKit {
  constructor(opts = {}) {
    this.stats = new FrameStats();
    this.quality = new QualityGovernor(opts.governor);
    this.dynres = new DynamicResolution(opts.dynres);
    this.enabled = true;
    this._t0 = 0;
  }
  begin() {
    if (!this.enabled) return;
    this._t0 = (typeof performance !== 'undefined' ? performance.now() : Date.now());
  }
  end() {
    if (!this.enabled) return 16.7;
    const t1 = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    const ms = t1 - this._t0;
    this.stats.push(ms);
    this.quality.step(ms);
    this.dynres.step(ms, this.quality.target);
    return ms;
  }
  get budgets() { return this.quality.budgets; }
}

// ────────────────────────────────────────────────────────────────
/**
 * 特效引擎（VFX）。
 *
 * 设计要点，全部服务于"直接可用 + 不掉帧"：
 *  1. **固定对象池**。粒子一次性分配、复用，运行期零 GC。
 *     原实现在 `burst()` 里 `push` 新对象、在每帧 `filter` 重建数组，
 *     连续爆特效时会持续分配/回收内存，正是掉帧的来源之一。
 *  2. **按类型批量绘制**。同类型的粒子走同一条路径设置，减少 canvas 状态切换。
 *  3. **确定性**。粒子初始速度来自确定性伪随机（seed 可传入），
 *     所以同一段回放能截出一模一样的图，便于自动化验收。
 *  4. **预算自适应**。`budget` 由 perf 层下发；超预算时新粒子被丢弃，
 *     而不是让整帧变慢——"特效变少"比"操作变卡"体验好得多。
 */



/** 粒子类型表：颜色、重力、阻尼、是否加色。 */
const PARTICLE_TYPES = {
  dust:   { color: '#8a9887', gravity: 40,  drag: 2.2, additive: false, fade: 1 },
  ember:  { color: '#e8a34e', gravity: -14, drag: 0.9, additive: true,  fade: 1 },
  spark:  { color: '#ffd9a0', gravity: 180, drag: 0.6, additive: true,  fade: 1 },
  ash:    { color: '#6e7a76', gravity: 12,  drag: 1.6, additive: false, fade: 1 },
  smoke:  { color: '#3c4a4c', gravity: -6,  drag: 1.2, additive: false, fade: 1 },
  splash: { color: '#9fc4c8', gravity: 320, drag: 0.4, additive: true,  fade: 1 },
  gold:   { color: '#f4ce85', gravity: 60,  drag: 1.4, additive: true,  fade: 1 },
  jade:   { color: '#8ad0b4', gravity: 40,  drag: 1.6, additive: true,  fade: 1 },
  blood:  { color: '#a5574d', gravity: 210, drag: 1.0, additive: false, fade: 1 },
};

/** 固定容量的粒子池。 */
class ParticlePool {
  constructor(capacity = 900) {
    this.cap = capacity;
    this.n = 0;            // 活跃数量（活跃粒子永远排在前面）
    this.budget = capacity;
    // 结构体数组：每个字段一条 TypedArray，缓存友好。
    this.x = new Float32Array(capacity);
    this.y = new Float32Array(capacity);
    this.vx = new Float32Array(capacity);
    this.vy = new Float32Array(capacity);
    this.life = new Float32Array(capacity);
    this.max = new Float32Array(capacity);
    this.size = new Float32Array(capacity);
    this.rot = new Float32Array(capacity);
    this.spin = new Float32Array(capacity);
    this.kind = new Uint16Array(capacity);
    this.seed = 0;
    // 定义表 = 内置类型 + 运行期注册的自定义颜色。
    // 保留自定义颜色是为了让 kit 能**原样复刻**调用方传入的颜色，
    // 而不是强行归并到内置调色板——池化不应该改变画面。
    this.types = Object.keys(PARTICLE_TYPES);
    this.defs = this.types.map((k) => PARTICLE_TYPES[k]);
    this.colorIndex = new Map(this.types.map((k, i) => [k, i]));
  }

  /** 注册（或复用）一个自定义颜色，返回定义下标。 */
  defineColor(color, opts = {}) {
    const hit = this.colorIndex.get(color);
    if (hit !== undefined) return hit;
    const i = this.defs.length;
    this.defs.push({
      color,
      gravity: opts.gravity ?? 46,
      drag: opts.drag ?? 1.8,
      additive: opts.additive ?? false,
      fade: 1,
    });
    this.colorIndex.set(color, i);
    return i;
  }

  /**
   * 把内置类型名或任意颜色字符串解析成定义下标。
   * 一次 Map 查找即可——colorIndex 同时覆盖内置类型与注册过的自定义颜色。
   */
  resolve(key, opts) {
    const hit = this.colorIndex.get(key);
    if (hit !== undefined) return hit;
    return this.defineColor(key, opts);
  }

  /**
   * 投放一个粒子。`type` 可以是内置类型名、任意颜色字符串，
   * **也可以是一个已解析好的定义下标**（number）。
   *
   * 允许传下标很重要：批量投放时若每个粒子都去做一次 Map 查找，
   * 热路径上会被这点开销吃掉——微基准里实测能拖慢一倍。
   * 所以 `burst()` 先解析一次，再循环传下标。
   */
  spawn(type, x, y, vx, vy, life, size, spin = 0) {
    if (this.n >= Math.min(this.cap, this.budget)) return false;
    const i = this.n++;
    const k = typeof type === 'number' ? type : this.resolve(type);
    this.x[i] = x; this.y[i] = y; this.vx[i] = vx; this.vy[i] = vy;
    this.life[i] = life; this.max[i] = life; this.size[i] = size;
    this.rot[i] = hash32((this.seed + i) | 0) * VK_TAU;
    this.spin[i] = spin;
    this.kind[i] = k;
    return true;
  }

  /**
   * 在半径内确定性爆开一团粒子。
   * 定义下标只解析一次——否则每个粒子都要查一次 Map。
   */
  burst(type, x, y, count, speed, power = 1, life = 0.6, size = 2.4) {
    const k = typeof type === 'number' ? type : this.resolve(type);
    let made = 0;
    for (let i = 0; i < count; i++) {
      // 用整数哈希而不是 Math.sin：这里每颗粒子要抽 5 个随机数，
      // 是整个系统最热的一段，三角函数会被放大成实打实的毫秒。
      this.seed = (this.seed + 1) | 0;
      const s0 = hash32(this.seed * 3 + 1);
      const s1 = hash32(this.seed * 5 + 2);
      const s2 = hash32(this.seed * 7 + 3);
      const s3 = hash32(this.seed * 11 + 4);
      const s4 = hash32(this.seed * 13 + 5);
      const a = s0 * VK_TAU;
      const sp = speed * (0.35 + s1 * 0.9);
      if (!this.spawn(k, x, y, Math.cos(a) * sp, Math.sin(a) * sp * 0.7 - 20 * power,
        life * (0.6 + s2 * 0.7), size * (0.6 + s3 * 0.9), (s4 - 0.5) * 6)) break;
      made++;
    }
    return made;
  }

  /**
   * 推进一帧。用"就地压缩"代替 filter：
   * 死掉的粒子与数组末尾的活跃粒子交换，然后 n--。
   * O(活跃数)、零分配。
   */
  update(dt) {
    // 把字段数组取到局部变量：热循环里少解引用十几次，JIT 也更容易向量化。
    const { x, y, vx, vy, life, max, size, rot, spin, kind, defs } = this;
    let i = 0;
    let n = this.n;
    while (i < n) {
      life[i] -= dt;
      if (life[i] <= 0) {
        const j = --n;
        if (j !== i) {
          x[i] = x[j]; y[i] = y[j];
          vx[i] = vx[j]; vy[i] = vy[j];
          life[i] = life[j]; max[i] = max[j];
          size[i] = size[j]; rot[i] = rot[j];
          spin[i] = spin[j]; kind[i] = kind[j];
        }
        continue; // 不递增 i：换过来的粒子还没检查
      }
      const def = defs[kind[i]];
      const drag = Math.exp(-def.drag * dt);
      vx[i] *= drag;
      vy[i] = vy[i] * drag + def.gravity * dt;
      x[i] += vx[i] * dt;
      y[i] += vy[i] * dt;
      rot[i] += spin[i] * dt;
      i++;
    }
    this.n = n;
  }

  clear() { this.n = 0; }
}

/** 冲击波环。数量很少，用普通数组即可。 */
class Shockwaves {
  constructor(cap = 24) {
    this.cap = cap;
    this.list = [];
  }
  add(x, y, { max = 0.55, radius = 95, squash = 0.16, color = '#dfbd7a', width = 2, air = false } = {}) {
    if (this.list.length >= this.cap) this.list.shift();
    this.list.push({ x, y, life: 0, max, radius, squash, color, width, air });
  }
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const w = this.list[i];
      w.life += dt;
      if (w.life >= w.max) this.list.splice(i, 1);
    }
  }
  draw(ctx, camera) {
    for (const w of this.list) {
      const q = w.life / w.max;
      const r = 10 + q * w.radius;
      ctx.save();
      ctx.globalAlpha = (1 - q) * 0.7;
      ctx.strokeStyle = w.color;
      ctx.lineWidth = w.width * (1 - q) + 0.5;
      ctx.beginPath();
      ctx.ellipse(w.x - camera, w.y, r, w.air ? r * 0.75 : r * w.squash, 0, 0, VK_TAU);
      ctx.stroke();
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/**
 * 速度线：屏幕空间（不随相机滚动）的横向拖影，速度越高越明显。
 * 这是"跑得很快"最廉价也最有效的视觉语言。
 */
class SpeedLines {
  constructor(max = 42) {
    this.max = max;
    this.lines = [];
    this.acc = 0;
  }
  update(dt, { speed = 0, active = true, w = 1280, h = 720, reduced = false } = {}) {
    // 使用与物理解耦的生成率，且由 dt 驱动，帧率无关
    const rate = active ? clamp((speed - 280) / 90, 0, 1) * (reduced ? 5 : 26) : 0;
    this.acc += rate * dt;
    while (this.acc >= 1 && this.lines.length < this.max) {
      this.acc -= 1;
      this.lines.push({
        y: Math.random() * h,
        len: 40 + Math.random() * 120,
        x: w + 60,
        v: 900 + Math.random() * 1400,
        a: 0.05 + Math.random() * 0.14,
      });
    }
    for (let i = this.lines.length - 1; i >= 0; i--) {
      const l = this.lines[i];
      l.x -= l.v * dt;
      if (l.x + l.len < -40) this.lines.splice(i, 1);
    }
  }
  draw(ctx, w) {
    if (!this.lines.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const l of this.lines) {
      const g = ctx.createLinearGradient(l.x, 0, l.x + l.len, 0);
      g.addColorStop(0, 'rgba(220,235,235,0)');
      g.addColorStop(0.5, `rgba(220,235,235,${l.a})`);
      g.addColorStop(1, 'rgba(220,235,235,0)');
      ctx.fillStyle = g;
      ctx.fillRect(l.x, l.y, l.len, 1.2);
    }
    ctx.restore();
  }
  clear() { this.lines.length = 0; }
}

/**
 * 运动残影：在身体后方叠若干半透明副本。
 * 比原实现的"按时间抽帧"更稳——这里按**距离**抽帧，
 * 因为高速时相邻物理帧的距离才是可见拖影的成因。
 */
function drawSmear(ctx, camera, samples, draw, { strength = 0.6, count = 4, distance = 26 } = {}) {
  if (!samples.length || strength <= 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  let last = samples[samples.length - 1];
  for (let k = 0; k < count; k++) {
    // 从队尾往前找，每隔 distance 像素取一个样本
    let picked = null;
    for (let i = samples.length - 1; i >= 0; i--) {
      if (last.x - samples[i].x >= distance * (k + 1)) { picked = samples[i]; break; }
    }
    if (!picked) break;
    ctx.globalAlpha = strength * (0.16 - k * 0.03);
    draw(ctx, picked.x - camera, picked.y, picked);
  }
  ctx.restore();
}

/**
 * 把上面这些拼成一个开箱即用的特效层。
 * 集成方法见 index.js 的 install()：它会把这一层挂到任意 Renderer 实例上。
 */
class VFXLayer {
  constructor({ capacity = 900 } = {}) {
    this.particles = new ParticlePool(capacity);
    this.waves = new Shockwaves();
    this.lines = new SpeedLines();
    this.shake = 0;
    this.flash = 0;
    this.goldFlash = 0;
    this.samples = [];       // 身体采样，供残影使用
    this.footPrev = [null, null];
    this._typeIndex = this.particles.types;
  }

  /** 记录一次身体位置采样（由 render 每帧调用）。 */
  sampleBody(x, y, extra) {
    this.samples.push({ x, y, ...extra });
    while (this.samples.length > 64) this.samples.shift();
  }

  update(dt, ctx = {}) {
    this.particles.budget = ctx.budget ?? this.particles.cap;
    this.particles.update(dt);
    this.waves.update(dt);
    this.lines.update(dt, ctx);
    this.shake = Math.max(0, this.shake - dt * 38);
    this.flash = Math.max(0, this.flash - dt);
    this.goldFlash = Math.max(0, this.goldFlash - dt);
  }

  /** 足底扬尘。用 IK 解出的真实脚点，落在哪就在哪扬灰。 */
  footfall(feet, grounded, dt) {
    if (!grounded) { this.footPrev = [null, null]; return; }
    feet.forEach((f, i) => {
      const prev = this.footPrev[i];
      if (prev && prev[1] > -6 && f[1] <= -1 && Math.abs(f[0] - prev[0]) < 30) {
        // 脚从空中落到地面 → 一次落尘
        this.particles.burst('dust', f[0], f[1] - 1, 5, 46, 0.5, 0.45, 1.6);
      }
      this.footPrev[i] = [f[0], f[1]];
    });
  }

  /** 按类型批量绘制粒子。 */
  draw(ctx, camera) {
    const P = this.particles;
    if (!P.n) return;
    const defs = P.defs;
    // 先画非加色（尘土/血/烟），再加色（火星/金/玉），避免加色被压在下面
    for (const additive of [false, true]) {
      ctx.save();
      if (additive) ctx.globalCompositeOperation = 'lighter';
      for (let ti = 0; ti < defs.length; ti++) {
        const def = defs[ti];
        if (!!def.additive !== additive) continue;
        ctx.fillStyle = def.color;
        ctx.beginPath();
        // 只遍历一遍：命中的直接入 path，没命中的几乎零成本。
        // （早期版本为了"提前跳过空类型"先扫一遍统计，结果变成两趟遍历，
        //   类型一多反而更慢——这类"优化"必须以实测为准。）
        let hit = false;
        for (let i = 0; i < P.n; i++) {
          if (P.kind[i] !== ti) continue;
          const q = P.life[i] / P.max[i];
          const s = P.size[i] * (def.fade ? q : 1);
          if (s <= 0.05) continue;
          const px = P.x[i] - camera, py = P.y[i];
          // 用一个小菱形代替圆：视觉上一样、比 arc() 快数倍
          ctx.moveTo(px + s, py);
          ctx.lineTo(px, py + s);
          ctx.lineTo(px - s, py);
          ctx.lineTo(px, py - s);
          hit = true;
        }
        if (hit) ctx.fill();
      }
      ctx.restore();
    }
  }

  clear() {
    this.particles.clear();
    this.waves.clear();
    this.lines.clear();
    this.samples.length = 0;
    this.footPrev = [null, null];
    this.shake = 0; this.flash = 0; this.goldFlash = 0;
  }
}

// visual-kit/src/canvas.js
// ────────────────────────────────────────────────────────────────
/**
 * 离屏画布工厂。
 *
 * 单独一个模块，而不是在 postfx / art / index 里各写一份：
 * 打包成单文件时所有模块共享同一作用域，三份同名函数会直接让脚本语法报错
 * （见 tools/bundle.mjs 的冲突检测）。放在这里既消掉重复，也消掉冲突。
 *
 * 优先用 `OffscreenCanvas`（不占 DOM、可离线线程绘制），
 * 退化时才创建普通 canvas。
 */

function vkMakeCanvas(w, h) {
  if (typeof OffscreenCanvas !== 'undefined') return new OffscreenCanvas(w, h);
  if (typeof document === 'undefined') {
    throw new Error('vkMakeCanvas: 当前环境既没有 OffscreenCanvas 也没有 document');
  }
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}


// ────────────────────────────────────────────────────────────────
// visual-kit/src/postfx.js
// ────────────────────────────────────────────────────────────────
/**
 * 后处理。
 *
 * 原则：**每一档都能单独关掉**，且全部走离屏缓冲，不改动主画布的像素格式。
 * 后处理是最容易把帧率吃光的东西，所以每一道的成本都写在这里，
 * 由 perf 的 QualityGovernor 决定开到哪一档。
 *
 *   Bloom      1 次降采样 + 1 次平方（阈值近似）+ 1 次放大合成
 *   ChromaticAberration  2 次全屏过滤绘制（仅满配档）
 *   Grain      1 次平铺绘制（贴图预生成，运行期零成本）
 *   Vignette   1 次渐变填充
 */





/**
 * 廉价 bloom。
 *
 * 经典做法是"亮度阈值 → 高斯模糊 → 叠加"，在 Canvas 2D 上没有 shader，
 * 全屏高斯太贵。这里的近似是：
 *   1. 降采样到 1/4（同时起到模糊作用）
 *   2. 用 multiply 把图像与自身相乘 → 平方亮度曲线
 *      （暗部趋近 0，亮部保留 → 天然的 soft threshold）
 *   3. 放大回全屏、lighter 叠加
 * 效果接近真 bloom，成本约为其 1/6。
 */
class BloomPass {
  constructor(scale = 4, threshold = 0.62, strength = 0.55) {
    this.scale = scale;
    this.threshold = threshold;
    this.strength = strength;
    this.a = null;
    this.b = null;
    this.w = 0; this.h = 0;
    this.enabled = true;
  }
  resize(w, h) {
    const sw = Math.max(2, Math.ceil(w / this.scale));
    const sh = Math.max(2, Math.ceil(h / this.scale));
    if (this.w === sw && this.h === sh) return;
    this.a = vkMakeCanvas(sw, sh); this.a.getContext('2d');
    this.b = vkMakeCanvas(sw, sh); this.b.getContext('2d');
    this.w = sw; this.h = sh;
  }
  /** @param src 已画好整帧的 canvas */
  apply(dst, src, w, h, dt) {
    if (!this.enabled) return;
    this.resize(w, h);
    const ca = this.a.getContext('2d');
    const cb = this.b.getContext('2d');
    ca.setTransform(1, 0, 0, 1, 0, 0);
    ca.globalCompositeOperation = 'source-over';
    ca.clearRect(0, 0, this.w, this.h);
    ca.drawImage(src, 0, 0, w, h, 0, 0, this.w, this.h);

    // 平方亮度：暗部压到接近 0，亮部留住 → 近似阈值
    cb.setTransform(1, 0, 0, 1, 0, 0);
    cb.globalCompositeOperation = 'source-over';
    cb.clearRect(0, 0, this.w, this.h);
    cb.drawImage(this.a, 0, 0);
    cb.globalCompositeOperation = 'multiply';
    cb.drawImage(this.a, 0, 0);
    // 再补一次自身叠加，把高光推到溢出，形成光晕核心
    cb.globalCompositeOperation = 'lighter';
    cb.globalAlpha = clamp(this.threshold, 0, 1) * 0.5;
    cb.drawImage(this.a, 0, 0);
    cb.globalAlpha = 1;

    dst.save();
    dst.globalCompositeOperation = 'lighter';
    dst.globalAlpha = clamp(this.strength * (dt ? clamp(dt * 60, 0, 2) : 1), 0, 1);
    dst.drawImage(this.b, 0, 0, this.w, this.h, 0, 0, w, h);
    dst.restore();
  }
}

/**
 * 胶片颗粒。噪声贴图只在构造时生成一次，
 * 之后每帧只做一次平铺绘制 + 随机偏移，几乎零成本。
 */
class GrainPass {
  constructor(tile = 160, strength = 0.05) {
    this.tile = tile;
    this.strength = strength;
    this.enabled = true;
    this.pattern = null;
    this.canvasPattern = null;   // 缓存好的 CanvasPattern
    this._matrix = null;
    if (typeof document !== 'undefined') this._build();
  }
  _build() {
    const c = vkMakeCanvas(this.tile, this.tile);
    const g = c.getContext('2d');
    const img = g.createImageData(this.tile, this.tile);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      // 三角分布：比均匀分布更像真实胶片颗粒（中间调多、极值少）
      const v = 128 + (Math.random() + Math.random() - 1) * 150;
      d[i] = d[i + 1] = d[i + 2] = v;
      d[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    if (typeof document !== 'undefined' && document.createElement) {
      const tile = document.createElement('canvas');
      tile.width = tile.height = this.tile;
      tile.getContext('2d').drawImage(c, 0, 0);
      this.pattern = tile;
    } else {
      this.pattern = c;
    }
  }
  /**
   * 一次性把颗粒铺满全屏。
   *
   * 早期实现是双层 for 循环逐块 drawImage —— 1280×720 用 160px 贴图
   * 就是 40 次 drawImage，每帧 40 次调用足以吃掉好几毫秒。
   * 改成 CanvasPattern + 单次 fillRect：同样是那张贴图，
   * 但只有 1 次绘制调用，代价从 O(屏幕面积/贴图²) 降到 O(1)。
   */
  apply(dst, w, h, frame = 0) {
    if (!this.enabled || !this.pattern) return;
    // 用帧序号驱动偏移，确定性、可复现
    const ox = (frame * 7) % this.tile;
    const oy = (frame * 13) % this.tile;
    dst.save();
    dst.globalCompositeOperation = 'overlay';
    dst.globalAlpha = this.strength;
    let painted = false;
    if (!this.canvasPattern) {
      try {
        this.canvasPattern = dst.createPattern(this.pattern, 'repeat');
      } catch (_) { this.canvasPattern = null; }
    }
    if (this.canvasPattern) {
      try {
        if (typeof DOMMatrix !== 'undefined') {
          if (!this._matrix) this._matrix = new DOMMatrix();
          this._matrix.e = -ox;
          this._matrix.f = -oy;
          this.canvasPattern.setTransform(this._matrix);
        }
        dst.fillStyle = this.canvasPattern;
        dst.fillRect(0, 0, w, h);
        painted = true;
      } catch (_) { painted = false; }
    }
    if (!painted) {
      // 退化路径：环境不支持 pattern 变换时仍然铺满，只是调用次数多些
      for (let y = -oy; y < h; y += this.tile) {
        for (let x = -ox; x < w; x += this.tile) dst.drawImage(this.pattern, x, y);
      }
    }
    dst.restore();
  }
}

/**
 * 色差。仅满配档开启——它要额外两次全屏过滤绘制。
 * 通过一次性注入的 SVG feColorMatrix 分离通道，然后错位叠加。
 */
class ChromaticAberrationPass {
  constructor(offset = 1.2, filtersReady = false) {
    this.offset = offset;
    this.enabled = false;   // 由 install() 在确认可用后打开
    this.ready = filtersReady;
  }
  /** 注入 SVG 滤镜定义。返回是否成功。 */
  installFilters(doc = typeof document !== 'undefined' ? document : null) {
    if (!doc || this.ready) return this.ready;
    if (doc.getElementById('vk-ca-filters')) { this.ready = true; return true; }
    const NS = 'http://www.w3.org/2000/svg';
    const svg = doc.createElementNS(NS, 'svg');
    svg.id = 'vk-ca-filters';
    svg.setAttribute('width', '0');
    svg.setAttribute('height', '0');
    svg.style.position = 'absolute';
    svg.style.pointerEvents = 'none';
    const defs = doc.createElementNS(NS, 'defs');
    // 只留红 / 只留蓝两张矩阵
    for (const [id, r, g, b] of [['vk-ca-r', 1, 0, 0], ['vk-ca-b', 0, 0, 1]]) {
      const f = doc.createElementNS(NS, 'filter');
      f.id = id;
      const m = doc.createElementNS(NS, 'feColorMatrix');
      m.setAttribute('type', 'matrix');
      m.setAttribute('values', `${r} 0 0 0 0  0 ${g} 0 0 0  0 0 ${b} 0 0  0 0 0 1 0`);
      f.appendChild(m);
      defs.appendChild(f);
    }
    svg.appendChild(defs);
    doc.body.appendChild(svg);
    this.ready = true;
    return true;
  }
  /** @param src 全帧来源；本 pass 直接往 dst 叠两条通道。 */
  apply(dst, src, w, h) {
    if (!this.enabled || !this.ready) return;
    const o = this.offset;
    dst.save();
    dst.globalCompositeOperation = 'lighter';
    dst.globalAlpha = 0.5;
    try {
      dst.filter = 'url(#vk-ca-r)';
      dst.drawImage(src, -o, 0);
      dst.filter = 'url(#vk-ca-b)';
      dst.drawImage(src, o, 0);
      dst.filter = 'none';
    } catch (_) {
      // 某些环境不支持 filter url()：静默跳过，不影响其余画面
    }
    dst.restore();
  }
}

/** 暗角。用缓存的径向渐变，避免每帧重建。 */
class VignettePass {
  constructor(inner = 0.25, outer = 0.8, alpha = 0.22) {
    this.inner = inner; this.outer = outer; this.alpha = alpha;
    this.enabled = true;
    this._grad = null;
    this._key = '';
  }
  apply(dst, w, h) {
    if (!this.enabled) return;
    const key = `${w}x${h}`;
    if (this._key !== key) {
      const g = dst.createRadialGradient(w * 0.52, h * 0.43, h * this.inner, w * 0.52, h * 0.43, Math.max(w * 0.72, h * this.outer));
      g.addColorStop(0, 'rgba(2,9,12,0)');
      g.addColorStop(1, `rgba(2,9,12,${this.alpha})`);
      this._grad = g;
      this._key = key;
    }
    dst.fillStyle = this._grad;
    dst.fillRect(0, 0, w, h);
  }
}

/** 把四道后处理合成一个可开关的栈。 */
class PostStack {
  constructor(opts = {}) {
    this.bloom = new BloomPass(opts.bloomScale ?? 4, opts.bloomThreshold ?? 0.62, opts.bloomStrength ?? 0.5);
    this.grain = new GrainPass(opts.grainTile ?? 160, opts.grainStrength ?? 0.05);
    this.ca = new ChromaticAberrationPass(opts.caOffset ?? 1.2);
    this.vignette = new VignettePass();
    this.frame = 0;
  }
  /** 依据 perf 预算开关各道。 */
  configure(budgets) {
    if (!budgets) return;
    this.bloom.enabled = !!budgets.bloom;
    this.grain.enabled = !!budgets.grain;
    this.vignette.enabled = true;
    this.ca.enabled = !!budgets.aberration && this.ca.ready;
  }
  setEnabled(on) {
    this.bloom.enabled = on;
    this.grain.enabled = on;
    this.vignette.enabled = on;
    this.ca.enabled = on && this.ca.ready;
  }
}

// ────────────────────────────────────────────────────────────────
/**
 * 剧情氛围层（story ambience）。
 *
 * 这一层做的事只有一件：**把故事里已经发生的事，变成看得见的东西**。
 * 它不新增玩法、不改数值、不碰角色——只旁听原游戏发出的事件，
 * 然后在画面上叠加对应的元素。
 *
 * 每一处效果都对应剧情里的一个具体事实，不是随手加的"好看的粒子"：
 *
 * | 效果 | 触发 | 剧情依据 |
 * |---|---|---|
 * | 记名辉光 | 捡到铜片 `collect` | 铜片帮助记忆；"人与人的记忆才是锚" |
 * | 记忆痕 | 走过之后持续 | 走过的路上留下记名 |
 * | 桥的凝实 | 铜片数 / `bridge-restored` | a12 三段讲述让桥逐段凝实 |
 * | 钟波 | `boss-broken` | 常晚敲钟破盾——把声音画出来 |
 * | 送灯 | 第一幕后段 / `checkpoint` | 北岸送灯；炉火不能熄 |
 * | 字痕 | 全程，按章节 | "名碑先失字，现实随后消失" |
 * | 灰烬 | 全程，偏冷时更密 | 灰烬之城、灰潮 |
 * | 七夜寒 | 随进度推进 | 王国粮煤只有七夜；陆承女儿受寒 |
 *
 * 性能约定：全部固定容量的结构体数组，运行期零分配；
 * 数量受 `budget` 限制，超预算时丢弃新元素而不是拖慢整帧。
 */



/* ------------------------------------------------------------------ *
 * 各类效果的固定池
 * ------------------------------------------------------------------ */

/** 上升的微尘（记忆痕 / 灰烬 / 火星共用一条通道，按 kind 区分外观）。 */
class MoteField {
  constructor(cap = 260) {
    this.cap = cap;
    this.n = 0;
    this.x = new Float32Array(cap);
    this.y = new Float32Array(cap);
    this.vx = new Float32Array(cap);
    this.vy = new Float32Array(cap);
    this.life = new Float32Array(cap);
    this.max = new Float32Array(cap);
    this.size = new Float32Array(cap);
    this.seed = new Float32Array(cap);
    this.kind = new Uint8Array(cap);      // 0 记忆 1 灰烬 2 火星
  }
  add(x, y, vx, vy, life, size, kind) {
    if (this.n >= this.cap) return false;
    const i = this.n++;
    this.x[i] = x; this.y[i] = y; this.vx[i] = vx; this.vy[i] = vy;
    this.life[i] = life; this.max[i] = life; this.size[i] = size;
    this.seed[i] = Math.random(); this.kind[i] = kind;
    return true;
  }
  update(dt, wind) {
    let i = 0;
    while (i < this.n) {
      this.life[i] -= dt;
      if (this.life[i] <= 0) {
        const j = --this.n;
        if (j !== i) {
          this.x[i] = this.x[j]; this.y[i] = this.y[j];
          this.vx[i] = this.vx[j]; this.vy[i] = this.vy[j];
          this.life[i] = this.life[j]; this.max[i] = this.max[j];
          this.size[i] = this.size[j]; this.seed[i] = this.seed[j];
          this.kind[i] = this.kind[j];
        }
        continue;
      }
      // 灰烬飘、记忆升、火星窜，三种运动互不相同
      const k = this.kind[i];
      const drag = Math.exp(-(k === 0 ? 0.7 : 1.5) * dt);
      this.vx[i] = this.vx[i] * drag + wind * (k === 1 ? 1.6 : 0.5) * dt;
      this.vy[i] = this.vy[i] * drag + (k === 2 ? -46 : k === 1 ? -8 : -20) * dt;
      this.x[i] += this.vx[i] * dt;
      this.y[i] += this.vy[i] * dt;
      i++;
    }
  }
  clear() { this.n = 0; }
}

const MOTE_COLORS = ['#f4ce85', '#8d9490', '#e59540'];
const MOTE_LIFE = [2.6, 4.2, 1.5];

/** 扩散光环（记名辉光 / 钟波）。 */
class Rings {
  constructor(cap = 16) {
    this.cap = cap;
    this.list = [];
  }
  add(x, y, { max = 0.8, radius = 90, color = '#f4ce85', width = 2, flat = 0.14 } = {}) {
    if (this.list.length >= this.cap) this.list.shift();
    this.list.push({ x, y, life: 0, max, radius, color, width, flat });
  }
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const r = this.list[i];
      r.life += dt;
      if (r.life >= r.max) this.list.splice(i, 1);
    }
  }
  draw(ctx, camera) {
    for (const r of this.list) {
      const q = r.life / r.max;
      const rad = 8 + q * r.radius;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (1 - q) * 0.55;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = r.width * (1 - q) + 0.4;
      ctx.beginPath();
      ctx.ellipse(r.x - camera, r.y, rad, rad * r.flat, 0, 0, VK_TAU);
      ctx.stroke();
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/** 纸灯（北岸送灯）。 */
class Lanterns {
  constructor(cap = 14) {
    this.cap = cap;
    this.list = [];
  }
  release(x, y) {
    if (this.list.length >= this.cap) this.list.shift();
    this.list.push({ x, y, life: 0, max: 7 + Math.random() * 3, sway: Math.random() * VK_TAU, size: 5 + Math.random() * 3 });
  }
  update(dt, wind) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const l = this.list[i];
      l.life += dt;
      l.sway += dt * 0.8;
      l.x += wind * 6 * dt;
      l.y -= (11 + l.size * 0.7) * dt;
      if (l.life >= l.max) this.list.splice(i, 1);
    }
  }
  draw(ctx, camera) {
    for (const l of this.list) {
      const fade = 1 - Math.max(0, (l.life - l.max * 0.7) / (l.max * 0.3));
      const x = l.x - camera + Math.sin(l.sway) * 5;
      const y = l.y;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.5 * fade;
      // 灯纸：先一团光，再一个方形灯身
      const g = ctx.createRadialGradient(x, y, 0, x, y, l.size * 4.5);
      g.addColorStop(0, 'rgba(255,196,110,0.55)');
      g.addColorStop(1, 'rgba(255,150,70,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - l.size * 4.5, y - l.size * 4.5, l.size * 9, l.size * 9);
      ctx.globalAlpha = 0.72 * fade;
      ctx.fillStyle = '#f2b45e';
      ctx.beginPath();
      ctx.ellipse(x, y, l.size * 0.62, l.size * 0.82, 0, 0, VK_TAU);
      ctx.fill();
      ctx.restore();
    }
  }
  clear() { this.list.length = 0; }
}

/** 字痕（笔画碎片）：空气里慢慢飘散、逐渐淡去的短笔画。 */
class Glyphs {
  constructor(cap = 26) {
    this.cap = cap;
    this.list = [];
  }
  add(x, y) {
    if (this.list.length >= this.cap) this.list.shift();
    // 每一"笔"就是一条短线，加一个随机的错切角度，看起来像残缺的字
    const a = Math.random() * VK_TAU;
    const len = 7 + Math.random() * 16;
    this.list.push({
      x, y, life: 0, max: 3.4 + Math.random() * 2.6,
      dx: Math.cos(a) * len, dy: Math.sin(a) * len * 0.5,
      w: 0.8 + Math.random() * 1.2,
    });
  }
  update(dt, wind) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const g = this.list[i];
      g.life += dt;
      g.x += wind * 3 * dt;
      g.y -= 5 * dt;
      if (g.life >= g.max) this.list.splice(i, 1);
    }
  }
  draw(ctx, camera) {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#c8d6d2';
    ctx.lineCap = 'round';
    for (const g of this.list) {
      const q = g.life / g.max;
      // 两端淡出：起笔重、收笔轻，像真的在化掉
      ctx.globalAlpha = 0.42 * Math.sin(Math.PI * clamp(q, 0, 1)) ** 0.7;
      ctx.lineWidth = g.w;
      ctx.beginPath();
      ctx.moveTo(g.x - camera, g.y);
      ctx.lineTo(g.x - camera + g.dx, g.y + g.dy);
      ctx.stroke();
    }
    ctx.restore();
  }
  clear() { this.list.length = 0; }
}

/* ------------------------------------------------------------------ *
 * 氛围层
 * ------------------------------------------------------------------ */

/** 每章的氛围配方。第一幕偏暖（有灯、有炉），第二幕的三域偏冷偏旷。 */
const STORY_FX = {
  prologue: { ash: 1.0, glyph: 0.8, mote: 0.7, cold: 0.10, lantern: 0 },
  district: { ash: 0.75, glyph: 1.0, mote: 1.0, cold: 0.16, lantern: 0.35 },
  covenant: { ash: 0.5, glyph: 0.7, mote: 0.8, cold: 0.30, lantern: 0.25 },
  lantern: { ash: 0.5, glyph: 0.6, mote: 0.8, cold: 0.24, lantern: 0.55 },
};

const DEFAULT_STORY_FX = STORY_FX.prologue;

class StoryAmbience {
  constructor(opts = {}) {
    this.motes = new MoteField(opts.moteCap ?? 260);
    this.rings = new Rings();
    this.lanterns = new Lanterns();
    this.glyphs = new Glyphs();

    this.budget = opts.budget ?? 260;
    this.reduced = false;
    this.wind = 26;                 // 世界向的风（px/s），受章节影响
    this.travelled = 0;             // 累计走过的距离，用来稀疏地留下记忆痕
    this._lastPlayerX = null;
    this._lanternCooldown = 0;
    this._ashAcc = 0;
    this._glyphAcc = 0;
    this.flash = 0;                 // 记名瞬间的整屏暖闪
    this.flashColor = '#f4ce85';
    this.coldOverride = null;       // 外部强制指定冷调（演示页滑块）；null = 按进度自动
  }

  /* -------- 旁听原游戏事件 -------- */

  /**
   * @param ev   原游戏 `renderer.event()` 收到的同一个事件对象（只读）
   * @param player 玩家状态（只读）
   */
  onEvent(ev, player, renderer) {
    if (!ev || !ev.type) return;
    const x = ev.x ?? player?.x ?? 0;
    const y = ev.y ?? (player?.y ?? 0) - 4;

    switch (ev.type) {
      // 捡到铜片 = 记住了一个名字。给一柱上升的金色光尘。
      case 'collect':
        this.nameRecall(x, y);
        break;

      // 常晚敲钟破盾——把钟声画出来：一圈快速扩散的金环。
      case 'boss-broken':
        this.rings.add(x, y, { max: 0.9, radius: 190, color: '#ffe9b4', width: 3, flat: 0.5 });
        for (let i = 0; i < 26; i++) {
          this.motes.add(x, y, (hash32(i * 7 + 1) - 0.5) * 150, -30 - hash32(i * 13) * 70,
            1.5 + hash32(i * 3) * 0.8, 1.6 + hash32(i * 5) * 1.4, 2);
        }
        break;

      // 可选共鸣：记忆涌上来
      case 'resonance':
        this.rings.add(x, y, { max: 1.1, radius: 150, color: '#f4ce85', width: 2.4 });
        this.flash = Math.max(this.flash, 0.5);
        for (let i = 0; i < 34; i++) {
          this.motes.add(x, y, (hash32(i * 11 + 2) - 0.5) * 110, -20 - hash32(i * 17) * 80,
            2.2 + hash32(i * 7) * 1.2, 1.4 + hash32(i * 19) * 1.6, 0);
        }
        break;

      // 检查点 = 到了新地方，也是一个可以放灯的时机（北岸送灯）
      case 'checkpoint':
        this.rings.add(x, y, { max: 1.0, radius: 120, color: '#e8c988', width: 2, flat: 0.2 });
        this._lanternReady = true;
        break;

      // 灯点着 / 添了柴：炉火不能熄
      case 'warmth':
      case 'lamp-lit':
        for (let i = 0; i < 18; i++) {
          this.motes.add(x, y, (hash32(i * 23 + 5) - 0.5) * 40, -34 - hash32(i * 29) * 46,
            1.4 + hash32(i * 31) * 0.9, 1.3 + hash32(i * 37) * 1.5, 2);
        }
        break;

      // 受击：抖落一片灰
      case 'hit':
        for (let i = 0; i < 14; i++) {
          this.motes.add(x, y, (hash32(i * 41 + 7) - 0.5) * 90, -20 - hash32(i * 43) * 40,
            1.1 + hash32(i * 47) * 0.7, 1.2 + hash32(i * 53) * 1.3, 1);
        }
        break;

      // 重生：清干净，不留上一条命的痕迹
      case 'respawn':
        this.clear();
        break;

      default:
        break;
    }
  }

  /** 记名辉光：铜片被拾起。 */
  nameRecall(x, y) {
    this.rings.add(x, y, { max: 0.85, radius: 130, color: '#f4ce85', width: 2.2, flat: 0.22 });
    this.flash = Math.max(this.flash, 0.32);
    const n = Math.min(this.budget, 26);
    for (let i = 0; i < n; i++) {
      this.motes.add(
        x + (hash32(i * 3 + 1) - 0.5) * 22,
        y + (hash32(i * 5 + 2) - 0.5) * 14,
        (hash32(i * 7 + 3) - 0.5) * 46,
        -46 - hash32(i * 11 + 4) * 92,
        1.9 + hash32(i * 13 + 5) * 1.4,
        1.4 + hash32(i * 17 + 6) * 1.7,
        0,
      );
    }
  }

  /* -------- 逐帧推进 -------- */

  update(dt, ctx = {}) {
    const { camera = 0, w = 1280, h = 720, t = 0, player, menu, level, groundAt, reduced } = ctx;
    this.reduced = !!reduced;
    this.budget = Math.max(60, Math.min(this.motes.cap, (ctx.budget ?? this.motes.cap)));

    // 配方按关卡 id 取；取不到就用序章
    const recipe = STORY_FX[level?.id] || DEFAULT_STORY_FX;
    this.wind = 20 + recipe.cold * 60;

    // ---- 记忆痕：走过的地方留下缓慢上升的金尘 ----
    if (player && !menu && groundAt) {
      const px = player.x;
      if (this._lastPlayerX !== null) {
        const moved = px - this._lastPlayerX;
        this.travelled += Math.abs(moved);
        // 每走 26px 放一颗，密度与移动距离成正比——跑起来自然更密
        while (this.travelled > 26) {
          this.travelled -= 26;
          if (hash32(Math.round(px * 7 + this.travelled * 13)) < recipe.mote * 0.9) {
            this.motes.add(
              px - camera - 120 + hash32(Math.round(px)) * 240,
              groundAt(px) - 2,
              (hash32(Math.round(px * 3)) - 0.5) * 14,
              -14 - hash32(Math.round(px * 5)) * 16,
              MOTE_LIFE[0], 1.1 + hash32(Math.round(px * 11)) * 0.9, 0,
            );
          }
        }
      }
      this._lastPlayerX = px;
    }

    // ---- 灰烬：全程都有，越冷越密（"灰烬之城、灰潮"）----
    if (!menu && !this.reduced) {
      this._ashAcc += dt * 9 * recipe.ash;
      while (this._ashAcc >= 1) {
        this._ashAcc -= 1;
        this.motes.add(
          camera + hash32(Math.round(t * 60) + this.motes.n) * (w + 80) - 40,
          h * 0.5 + (hash32(Math.round(t * 31) + this.motes.n * 3) - 0.5) * h,
          -8 - hash32(this.motes.n * 7) * 14, 4 + hash32(this.motes.n * 11) * 8,
          MOTE_LIFE[1], 0.8 + hash32(this.motes.n * 13) * 1.0, 1,
        );
      }
    }

    // ---- 字痕：空气里慢慢化掉的笔画 ----
    if (!menu && !this.reduced) {
      this._glyphAcc += dt * 1.6 * recipe.glyph;
      while (this._glyphAcc >= 1) {
        this._glyphAcc -= 1;
        this.glyphs.add(
          camera + hash32(Math.round(t * 17) + this.glyphs.list.length) * (w + 120) - 60,
          h * (0.24 + hash32(Math.round(t * 13) + this.glyphs.list.length * 5) * 0.52),
        );
      }
    }

    // ---- 送灯：检查点之后、桥那一段，灯会陆续放上天 ----
    this._lanternCooldown -= dt;
    if (!menu && recipe.lantern > 0 && this._lanternReady && player && this._lanternCooldown <= 0) {
      this.lanternCooldown = 2.6 / Math.max(0.2, recipe.lantern);
      this._lanternReady = false;
      const gy = groundAt ? groundAt(player.x) : player.y;
      this.lanterns.release(player.x + 120 + hash32(Math.round(player.x)) * 200, gy - 30);
    }

    this.motes.update(dt, this.wind);
    this.rings.update(dt);
    this.lanterns.update(dt, this.wind);
    this.glyphs.update(dt, this.wind);
    this.flash = Math.max(0, this.flash - dt * 1.6);
  }

  /* -------- 绘制（调用方已设好世界→屏幕的 transform） -------- */

  draw(ctx, camera) {
    // 送灯在灰烬之下、光环之上
    this.lanterns.draw(ctx, camera);
    this.glyphs.draw(ctx, camera);

    // 微尘：按 kind 分两趟画，省掉逐个切换状态
    const P = this.motes;
    if (P.n) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const kind of [0, 2]) {          // 记忆痕与火星加色，灰烬不加
        ctx.fillStyle = MOTE_COLORS[kind];
        ctx.beginPath();
        for (let i = 0; i < P.n; i++) {
          if (P.kind[i] !== kind) continue;
          const q = P.life[i] / P.max[i];
          const s = P.size[i] * Math.sin(Math.PI * clamp(q, 0, 1)) ** 0.5;
          if (s <= 0.05) continue;
          const px = P.x[i] - camera, py = P.y[i];
          ctx.moveTo(px + s, py);
          ctx.lineTo(px, py + s);
          ctx.lineTo(px - s, py);
          ctx.lineTo(px, py - s);
        }
        ctx.fill();
      }
      ctx.restore();

      ctx.save();
      ctx.fillStyle = MOTE_COLORS[1];
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      for (let i = 0; i < P.n; i++) {
        if (P.kind[i] !== 1) continue;
        const s = P.size[i];
        const px = P.x[i] - camera, py = P.y[i];
        ctx.moveTo(px + s, py);
        ctx.lineTo(px, py + s);
        ctx.lineTo(px - s, py);
        ctx.lineTo(px, py - s);
      }
      ctx.fill();
      ctx.restore();
    }

    this.rings.draw(ctx, camera);
  }

  /**
   * 整体色调偏移：随进度变冷。
   * "王国粮煤只有七夜"——越往后越冷，是剧情给的物理事实。
   *
   * `coldOverride` 由外部（演示页的滑块）强制指定，
   * 设为 null 时按关卡进度自动计算。
   */
  drawGrade(ctx, w, h, progress = 0) {
    const cold = this.coldOverride !== null && this.coldOverride !== undefined
      ? this.coldOverride
      : clamp(progress, 0, 1);
    if (cold < 0.02) return;
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, `rgba(150,180,215,${1 - cold * 0.42})`);
    g.addColorStop(1, `rgba(120,150,190,${1 - cold * 0.5})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }

  /** 记名瞬间的整屏暖闪。 */
  drawFlash(ctx, w, h) {
    if (this.flash <= 0.001) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = this.flashColor;
    ctx.globalAlpha = this.flash * 0.1;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }

  clear() {
    this.motes.clear();
    this.rings.clear();
    this.lanterns.clear();
    this.glyphs.clear();
    this.travelled = 0;
    this._lastPlayerX = null;
    this._lanternCooldown = 0;
    this._lanternReady = false;
    this.flash = 0;
  }
}
